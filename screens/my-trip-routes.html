<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scentrip — 내 여행 · 내 동선</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../reference/tokens.css">
<link rel="stylesheet" href="../reference/components.css">
<style>
/* ============================================================
   Scentrip — 탐색 · 여행 동선 (Figma node 50:323 이식)
   색/라운드/타이포는 tokens.css var()만 사용.
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-family);
  letter-spacing: var(--letter-spacing);
  color: var(--color-content-default);
  background: var(--color-background);
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;
  overflow-wrap: break-word;
}
img { display: block; max-width: 100%; }
button { font-family: inherit; letter-spacing: inherit; cursor: pointer; }

.page { display: flex; flex-direction: column; align-items: stretch; width: 100%; min-height: 100vh; }

/* 프로필 칩 + 팝오버 (전 페이지 공용 헤더 컴포넌트) */
.profile { position: relative; }
.type-pill { display: flex; align-items: center; gap: var(--space-8); padding: 4px 4px 4px 12px; background: var(--color-surface-01); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-full); transition: background .18s ease, border-color .18s ease; }
.type-pill:hover, .type-pill[aria-expanded="true"] { background: var(--color-surface-02); border-color: var(--color-border-default); }
.profile-pop { width: 288px; padding: var(--space-8); }
/* 로그인/게스트 토글 (공용) */
html .guest-only { display: none; }
.is-guest .auth-only { display: none; }
.btn-login { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 var(--space-20); border-radius: var(--radius-full); background: var(--color-primary); color: var(--color-content-on-fill); font-size: var(--text-body-14); font-weight: 600; text-decoration: none; border: 0; transition: background .16s ease; }
.btn-login:hover { background: var(--color-primary-hover); }
.is-guest .btn-login { display: inline-flex; }
/* 게스트(비로그인): 개인화(매칭 정렬·취향 필터·AI 매칭 배지) 숨김 + 로그인 유도 배너 */
.is-guest .seg[data-sort="match"] { display: none; }
.is-guest .filter[data-key="taste"] { display: none; }
.is-guest .badge { display: none; }
.guest-banner { display: none; }
.is-guest .guest-banner { display: flex; align-items: center; gap: var(--space-16); padding: var(--space-20) var(--space-24); border-radius: var(--radius-xl); background: var(--scent-green-50); border: 1px solid var(--color-border-default); width: 100%; }
.guest-banner .gb-text { flex: 1 0 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.guest-banner .gb-text b { font-size: var(--text-body-16); font-weight: 600; color: var(--color-content-neutral); }
.guest-banner .gb-text span { font-size: var(--text-body-14); color: var(--color-content-neutral-muted); }

/* ---------- 탭 ---------- */
.tabs { display: flex; gap: 28px; align-items: flex-start; padding: 36px 60px; width: 100%; font-size: var(--text-title-32); font-weight: 600; line-height: 1.25; white-space: nowrap; }
.tabs .tab { color: var(--color-content-neutral-disabled); text-decoration: none; }
.tabs .tab.is-active { color: var(--color-primary); }

/* ---------- 섹션 공용 ---------- */
.section { padding: 36px 60px; width: 100%; background: var(--color-background); display: flex; flex-direction: column; gap: var(--space-24); }

/* ---------- 추천 동선 (featured) ---------- */
.featured { padding: 20px 60px 36px; }
.featured-head { display: flex; align-items: center; gap: var(--space-24); width: 100%; }
.featured-title { flex: 1 0 0; display: flex; gap: var(--space-8); align-items: center; min-width: 0; }
.featured-title .spark { width: 28px; height: 28px; color: var(--color-primary); flex: none; }
.featured-title h2 { font-size: var(--text-heading-24); font-weight: 600; line-height: 1.25; color: var(--color-content-neutral); }
.carousel-arrows { display: flex; gap: var(--space-8); flex: none; }
.arrow-btn { width: 36px; height: 36px; border-radius: var(--radius-full); border: 1px solid var(--color-neutral-border); background: var(--color-surface-overlay); display: flex; align-items: center; justify-content: center; color: var(--color-content-neutral-muted); }
.arrow-btn svg { width: 16px; height: 16px; }
.featured-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-24); }
.featured-card { border: 1px solid var(--color-neutral-border); border-radius: var(--radius-xl); overflow: hidden; box-shadow: var(--elevation-lg); display: flex; flex-direction: column; background: var(--color-surface-overlay); }
.fc-head { padding: var(--space-20); display: flex; flex-direction: column; gap: var(--space-12); }
.fc-badgerow { display: flex; align-items: center; justify-content: space-between; }
.fc-title { display: flex; flex-direction: column; gap: var(--space-4); }
.fc-title .t1 { font-size: var(--text-body-16); font-weight: 500; line-height: 1.5; color: var(--color-content-neutral-muted); }
.fc-title .t2 { font-size: var(--text-heading-24); font-weight: 600; line-height: 1.25; color: var(--color-content-neutral); }
.fc-meta { display: flex; gap: var(--space-6); font-size: var(--text-body-14); font-weight: 500; line-height: 1.5; color: var(--color-content-neutral-subtle); white-space: nowrap; flex-wrap: wrap; }
/* 사진 콜라주 — 카드 하단 full-bleed, 2px 간격, 4:3 가로형 타일(개별 라운드 없음) */
.fc-photos { display: flex; gap: 2px; aspect-ratio: 8 / 3; min-height: 0; }
.fc-big { flex: 1 1 50%; min-width: 0; min-height: 0; }
.fc-big img { display: block; width: 100%; height: 100%; object-fit: cover; }
.fc-grid { flex: 1 1 50%; min-width: 0; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; }
.fc-grid img { width: 100%; height: 100%; object-fit: cover; }
.carousel-dots { display: flex; gap: var(--space-6); justify-content: center; align-items: center; width: 100%; }
.carousel-dots i { width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--color-neutral-border); }
.carousel-dots i.active { width: 22px; background: var(--color-primary); }

/* ---------- AI 동선 제작 배너 ---------- */
.ai-banner-sec { padding: 12px 60px 24px; width: 100%; }
.ai-banner { display: flex; align-items: center; gap: var(--space-24); padding: 32px 48px; border: 1px solid var(--color-border-subtle); border-radius: var(--radius-2xl); background: linear-gradient(100deg, var(--scent-green-50), color-mix(in srgb, var(--scent-green-100) 55%, #fff)); }
.ai-banner-tx { flex: 1 1 auto; min-width: 0; }
.ai-banner-tx h2 { font-size: var(--text-heading-24); font-weight: 600; line-height: 1.3; color: var(--scent-green-950); }
.ai-banner-tx p { margin-top: var(--space-8); font-size: var(--text-body-16); color: var(--color-content-neutral-muted); }
.ai-banner-btn { flex: none; display: inline-flex; align-items: center; gap: var(--space-8); height: 52px; padding: 0 var(--space-24); border-radius: var(--radius-full); background: var(--gradient-depth); color: #fff; font-size: var(--text-body-16); font-weight: 600; text-decoration: none; transition: opacity .16s ease; }
.ai-banner-btn:hover { opacity: .92; }
.ai-banner-btn svg { width: 18px; height: 18px; }
@media (max-width: 640px) { .ai-banner { flex-direction: column; align-items: flex-start; gap: var(--space-16); padding: 28px 24px; } }

/* ---------- 필터 바 ---------- */
.filterbar { display: flex; gap: var(--space-24); align-items: center; width: 100%; flex-wrap: wrap; }
.filter-left { flex: 1 0 0; display: flex; gap: var(--space-24); align-items: center; min-width: 0; flex-wrap: wrap; }
.segmented { position: relative; display: flex; gap: var(--space-4); padding: var(--space-4); background: var(--color-neutral-subtle); border-radius: 999px; }
.seg { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; height: 36px; padding: 0 var(--space-16); border-radius: 999px; border: 0; background: none; font-size: var(--text-body-16); font-weight: 600; line-height: 1.5; color: var(--color-content-neutral-subtle); white-space: nowrap; transition: color .2s ease; }
.seg.is-active { color: var(--color-content-default); }
.seg-thumb { position: absolute; top: var(--space-4); bottom: var(--space-4); left: 0; width: 0; border-radius: 999px; background: var(--color-surface-overlay); box-shadow: var(--elevation-xs); z-index: 0; pointer-events: none; transition: transform .28s cubic-bezier(.22,.61,.36,1), width .28s cubic-bezier(.22,.61,.36,1); }
.divider-v { width: 1px; height: 20px; background: var(--color-neutral-border); flex: none; }
.filter-chips { display: flex; gap: var(--space-8); align-items: center; flex-wrap: wrap; }
.count { font-size: var(--text-body-14); font-weight: 600; line-height: 1.5; color: var(--color-content-neutral-muted); white-space: nowrap; flex: none; }
.seg { cursor: pointer; }

/* 필터 드롭다운 (라운드 그림자 셀렉트 팝오버) */
.filter { position: relative; }

/* ---------- 지역 필터 — 시·도 레일 + 시·군·구 리스트 ----------
   패널 자체는 무채색으로 두고 색은 '선택'에만 쓴다 (레일 선택 pill · 선택된 행 + 체크).
   행 구분은 박스가 아니라 헤어라인, 선택 표시는 체크박스가 아니라
   기존 필터 드롭다운(.filter-opt)과 같은 오른쪽 체크 아이콘. */
.region-pop { width: 520px; max-width: calc(100vw - 40px); padding: 0; border-radius: var(--radius-xl); box-shadow: var(--elevation-lg); overflow: hidden; display: flex; flex-direction: column; }
.rg-search { padding: var(--space-16) var(--space-16) var(--space-12); }
.rg-field { position: relative; display: flex; align-items: center; }
.rg-field > svg { position: absolute; right: var(--space-16); width: 18px; height: 18px; color: var(--color-content-neutral-subtle); pointer-events: none; transition: opacity .12s ease; }
.rg-clear { position: absolute; right: var(--space-12); display: none; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: var(--radius-md); background: none; color: var(--color-content-neutral-subtle); transition: background .14s ease, color .14s ease; }
.rg-clear svg { width: 18px; height: 18px; }
.rg-clear:hover { background: var(--color-neutral-border); color: var(--color-content-neutral); }
.rg-clear.is-on { display: inline-flex; }
.rg-field.is-filled > svg { opacity: 0; }
.rg-input { width: 100%; height: 46px; padding: 0 42px 0 var(--space-16); border: 1px solid transparent; border-radius: var(--radius-lg); background: var(--color-neutral-bg); font-family: inherit; letter-spacing: inherit; font-size: var(--text-body-14); font-weight: 500; color: var(--color-content-neutral); outline: none; transition: border-color .14s ease; }
.rg-input::placeholder { color: var(--color-content-neutral-subtle); font-weight: 400; }
.rg-input:focus { border-color: var(--color-neutral-border); }
.rg-input::-webkit-search-cancel-button { -webkit-appearance: none; }

.rg-body { display: flex; align-items: stretch; height: 316px; }
.rg-body.is-searching .rg-rail { display: none; }   /* 검색 결과는 시·도와 무관하므로 레일을 접는다 */
.rg-rail { position: relative; width: 152px; flex: none; overflow-y: auto; padding: var(--space-8) var(--space-16); background: var(--color-neutral-bg); display: flex; flex-direction: column; gap: var(--space-2); }
.rg-sido { display: flex; align-items: center; gap: var(--space-8); width: 100%; height: 40px; flex: none; padding: 0 var(--space-16); border: 0; background: none; border-radius: var(--radius-md); font-size: var(--text-body-14); font-weight: 600; line-height: 1.5; color: var(--color-content-neutral-muted); text-align: left; transition: background .14s ease, color .14s ease; }
.rg-sido:hover { color: var(--color-content-neutral); }
.rg-sido.is-active { background: var(--color-surface-overlay); color: var(--color-primary); box-shadow: var(--elevation-xs); }   /* 정렬 세그먼트의 흰 pill과 같은 강조 */
.rg-sido.is-off { color: var(--color-content-neutral-disabled); cursor: default; }
.rg-cnt { margin-left: auto; font-size: var(--text-caption-12); font-weight: 600; line-height: 1.5; color: var(--color-primary); font-variant-numeric: tabular-nums; flex: none; }

.rg-list { flex: 1 0 0; min-width: 0; overflow-y: auto; padding: 0 var(--space-16) var(--space-12); display: flex; flex-direction: column; }
.rg-row { display: flex; align-items: center; gap: var(--space-8); width: 100%; min-height: 48px; flex: none; padding: var(--space-12) 0; border: 0; border-bottom: 1px solid var(--color-border-subtle); background: none; text-align: left; }
.rg-row:last-child { border-bottom: 0; }

.rg-row.is-off { color: var(--color-content-neutral-disabled); cursor: default; }
.rg-label { flex: 1 0 0; min-width: 0; display: flex; align-items: baseline; gap: var(--space-4); font-size: var(--text-body-14); font-weight: 400; line-height: 1.5; color: var(--color-content-neutral); }
.rg-name { min-width: 0; }
.rg-label em { font-style: normal; margin-left: var(--space-4); font-size: var(--text-caption-12); font-weight: 400; color: var(--color-content-neutral-subtle); }
.rg-row.is-off .rg-label { color: var(--color-content-neutral-disabled); }
.rg-all { position: sticky; top: 0; z-index: 1; background: var(--color-surface-overlay); border-bottom-color: var(--color-neutral-border); }
.rg-all .rg-label { font-weight: 500; }
.rg-hit { background: none; color: var(--color-primary); font-weight: 600; }
.rg-hint { padding: var(--space-12) 0 var(--space-4); font-size: var(--text-caption-12); font-weight: 500; line-height: 1.5; color: var(--color-content-neutral-subtle); }
.rg-empty { margin: auto 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-6); padding: var(--space-32) var(--space-16); }
.rg-empty b { font-size: var(--text-body-14); font-weight: 600; color: var(--color-content-neutral); }
.rg-empty span { font-size: var(--text-body-14); font-weight: 400; color: var(--color-content-neutral-muted); }

.rg-foot { display: flex; align-items: center; gap: var(--space-8); padding: var(--space-12) var(--space-16); border-top: 1px solid var(--color-border-subtle); background: var(--color-surface-overlay); }
.rg-reset, .rg-apply { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-6); height: 44px; border-radius: var(--radius-lg); font-size: var(--text-body-14); font-weight: 600; line-height: 1.5; border: 0; white-space: nowrap; transition: background .16s ease, color .16s ease; }
.rg-reset { flex: none; padding: 0 var(--space-16); background: none; color: var(--color-content-neutral-muted); }
.rg-reset svg { width: 16px; height: 16px; }
.rg-reset:hover { background: var(--color-neutral-subtle); color: var(--color-content-neutral); }
.rg-reset:disabled { color: var(--color-content-neutral-disabled); cursor: not-allowed; pointer-events: none; }
.rg-apply { flex: 1 0 0; padding: 0 var(--space-24); background: var(--color-primary); color: var(--color-content-on-fill); }
.rg-apply:hover { background: var(--color-primary-hover); }
.rg-apply:active { background: var(--color-primary-active); }

@media (max-width: 640px) {
  .rg-rail { width: 112px; }
  .rg-body { height: 280px; }
}

/* ---------- 동선 카드 그리드 ---------- */
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: var(--space-24); row-gap: var(--space-48); align-items: start; transition: opacity .18s ease; }
.route-card { display: flex; flex-direction: column; gap: var(--space-24); }
.route-photo { position: relative; aspect-ratio: 371 / 200; overflow: hidden; border: 1px solid var(--color-border-subtle); border-radius: var(--radius-xl); }
.route-map { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.route-photo .badge { position: absolute; top: 12px; left: 12px; z-index: 3; }
.route-photo .heart { position: absolute; top: 12px; right: 12px; z-index: 3; }
.route-inset { position: absolute; left: 3.2%; top: 28%; width: 33.4%; bottom: 6%; border: 2px solid #fff; border-radius: var(--radius-lg); overflow: hidden; z-index: 2; }
.route-inset img { width: 100%; height: 100%; object-fit: cover; }
.route-lines { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
.route-lines polyline { fill: none; stroke: var(--color-content-subtle); stroke-width: 2; stroke-dasharray: 5 5; stroke-linecap: round; stroke-linejoin: round; }
.route-marker { position: absolute; width: 24px; height: 24px; transform: translate(-50%, -50%); border-radius: var(--radius-full); border: 1px solid #fff; display: flex; align-items: center; justify-content: center; font-size: var(--text-caption-12); font-weight: 600; line-height: 1.5; color: #fff; z-index: 2; }
.route-marker.m1 { left: 54.63%; top: 19.5%; background: var(--color-content-muted); }
.route-marker.m2 { left: 75.65%; top: 50%;   background: var(--color-content-subtle); }
.route-marker.m3 { left: 64.87%; top: 60%;   background: var(--color-content-subtle); }
.route-marker.m4 { left: 56.78%; top: 80%;   background: var(--color-content-subtle); }
.route-marker.m5 { left: 83.74%; top: 75%;   background: var(--color-content-disabled); }
.route-body { display: flex; flex-direction: column; gap: var(--space-8); }
.route-title { display: flex; gap: var(--space-6); font-size: var(--text-heading-20); font-weight: 600; line-height: 1.25; white-space: nowrap; }
.route-title .place { color: var(--color-content-subtle); }
.route-title .name { color: var(--color-content-neutral); }
.route-desc { font-size: var(--text-body-16); font-weight: 400; line-height: 1.5; color: var(--color-content-neutral-muted); }
.route-meta { display: flex; gap: var(--space-4); font-size: var(--text-body-16); font-weight: 500; line-height: 1.5; color: var(--color-content-neutral-subtle); white-space: nowrap; }

.badge { display: inline-flex; align-items: center; gap: var(--space-6); padding: var(--space-4) var(--space-10); border-radius: var(--radius-full); background: var(--color-surface-overlay); border: 1px solid var(--color-border-default); }
.badge svg { width: 14px; height: 14px; color: var(--color-content-subtle); }
.badge span { font-size: var(--text-body-14); font-weight: 600; line-height: 1.5; color: var(--color-content-subtle); white-space: nowrap; }

/* ---------- 더보기 ---------- */
.more-wrap { display: flex; justify-content: center; padding-top: var(--space-8); }
.more-btn { height: 44px; padding: 0 var(--space-24); border-radius: var(--radius-full); border: 1px solid var(--color-neutral-border); background: var(--color-surface-overlay); font-size: var(--text-body-16); font-weight: 600; color: var(--color-content-neutral-muted); }

/* ---------- 내 여행 · 서브탭 ---------- */
.subtabs { display: flex; justify-content: center; gap: var(--space-40); width: 100%; padding: 0 60px; border-bottom: 1px solid var(--color-border-subtle); background: var(--color-surface-overlay); }
.subtab { position: relative; padding: var(--space-16) var(--space-4) var(--space-12); font-size: var(--text-body-18); font-weight: 600; line-height: 1.5; color: var(--color-content-neutral-subtle); text-decoration: none; transition: color .14s ease; }
.subtab:hover { color: var(--color-content-neutral-muted); }
.subtab.is-active { color: var(--color-content-neutral); }
.subtab.is-active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--color-content-neutral); }

/* ---------- 로그인 게이트 ---------- */
.guest-gate { flex: 1 0 auto; align-items: center; justify-content: center; padding: 80px var(--space-32); }
.is-guest .guest-gate { display: flex; }
.gate-card { max-width: 480px; width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; gap: var(--space-16); padding: 56px 40px; background: var(--color-surface-overlay); border: 1px solid var(--color-border-default); border-radius: var(--radius-2xl); box-shadow: var(--elevation-md); }
.gate-icon { width: 72px; height: 72px; border-radius: var(--radius-full); background: var(--color-surface-01); color: var(--color-primary); display: flex; align-items: center; justify-content: center; }
.gate-icon svg { width: 34px; height: 34px; }
.gate-card h1 { font-size: var(--text-title-28); font-weight: 600; line-height: 1.35; color: var(--color-content-neutral); }
.gate-card p { font-size: var(--text-body-14); line-height: 1.8; color: var(--color-content-neutral-muted); }
.gate-card .btn-login { margin-top: var(--space-12); height: 48px; padding: 0 var(--space-32); font-size: var(--text-body-16); }

/* ---------- 내 동선 ---------- */
.section { padding-top: 28px; }
.mt-head { display: flex; align-items: baseline; gap: var(--space-8); }
.mt-head h2 { font-size: var(--text-heading-24); font-weight: 600; line-height: 1.25; color: var(--color-content-neutral); }
.mt-head .n { font-size: var(--text-heading-24); font-weight: 600; line-height: 1.25; color: var(--color-primary); font-variant-numeric: tabular-nums; }
.mt-bar { display: flex; align-items: center; gap: var(--space-16); width: 100%; }
.mt-bar .filter-chips { flex: 1 1 auto; }

/* ---------- 동선 카드 (지도+마커) ---------- */

function detailHref(r) {
  if (r.id) return `route-detail.html?from=mytrip&saved=${encodeURIComponent(r.id)}`;
  return "route-detail.html?" + new URLSearchParams({ from: "mytrip", name: r.name, place: r.place, desc: r.desc, meta: r.meta, match: r.match, pop: r.pop, sido: r.sido, owner: r.owner });

function routeCard(r, i) {

}

/* 동선 결과 화면(route-result.html)에서 '내 여행에 저장'한 동선 — 최근 저장이 맨 앞.
   TODO(개발): 실서비스는 저장 목록 API 로 대체 */
const SAVED_KEY = "scentrip_saved_routes";
function readSaved() {
  try { const a = JSON.parse(localStorage.getItem(SAVED_KEY) || "[]"); return Array.isArray(a) ? a.filter((r) => r && r.id && r.name) : []; }
  catch (e) { return []; }
}
/* 저장 해제 기록의 키 — 저장한 동선은 id(같은 제목이 여러 개일 수 있음), 샘플 동선은 이름 */
const keyOf = (r) => r.id || r.name;

/* match(취향 매칭%) · pop(인기) 값을 넣어 정렬이 실제로 보이게 한다 */
const ROUTES = [

}
function rgPickedCount(r) {   // 이 시·도에서 몇 곳을 골랐는지
  return rgDraft.includes(r.name) ? rgLive(r).length : rgDraft.filter((t) => t.startsWith(r.name + ">")).length;
}
function rgRenderRail() {
  rgRail.innerHTML = REGIONS.map((r) => {
    const off = r.count === 0;
    const picked = rgDraft.some((t) => t.split(">")[0] === r.name);
    const isAct = !rgQuery && r.name === rgActive;   // 검색 중에는 레일에 현재 시·도가 없다
    const cls = [isAct ? "is-active" : "", off ? "is-off" : "", picked ? "is-picked" : ""].filter(Boolean).join(" ");
    return `<button class="rg-sido${cls ? " " + cls : ""}" type="button" role="tab" aria-selected="${isAct}" data-sido="${r.name}"${off ? " disabled" : ""}>
      <span>${r.name}</span>${picked ? `<b class="rg-cnt">${rgPickedCount(r)}</b>` : ""}
    </button>`;
  }).join("");
  const act = rgRail.querySelector(".rg-sido.is-active");   // 선택된 시·도는 레일 안에서 항상 보이게
  if (act) {
    const top = act.offsetTop, bottom = top + act.offsetHeight;
    if (top < rgRail.scrollTop) rgRail.scrollTop = top - 8;
    else if (bottom > rgRail.scrollTop + rgRail.clientHeight) rgRail.scrollTop = bottom - rgRail.clientHeight + 8;
  }
}
function rgMark(text, q) {                                  // 검색어와 겹치는 글자만 강조
  const i = text.indexOf(q);
  return i < 0 ? text : `${text.slice(0, i)}<mark class="rg-hit">${text.slice(i, i + q.length)}</mark>${text.slice(i + q.length)}`;
}
function rgRenderList(keepScroll) {
  const top = rgListEl.scrollTop;
  rgBody.classList.toggle("is-searching", !!rgQuery);       // 검색 중에는 시·도 레일이 필요 없다
  rgClear.classList.toggle("is-on", !!rgQuery);
  rgClear.parentElement.classList.toggle("is-filled", !!rgQuery);   // 돋보기 ↔ 지우기 교체
  if (rgQuery) {
    const q = rgQuery;
    const hits = [];
    REGIONS.forEach((r) => {
      const hitSido = r.name.includes(q);
      if (hitSido && r.count > 0) hits.push({ token: r.name, label: r.name + " 전체", sub: "시·도 전체", count: r.count });
      r.units.forEach((u) => { if (hitSido || u.name.includes(q)) hits.push({ token: r.name + ">" + u.name, label: u.name, sub: r.name, count: u.count }); });
    });
    hits.sort((a, b) => (b.count > 0) - (a.count > 0));   // 데이터 있는 지역 먼저, 그 안에서는 지리 순서 유지
    rgListEl.innerHTML = hits.length
      ? `<p class="rg-hint">검색 결과 ${hits.length}곳</p>` + hits.map((h) => rgRow(h.token, rgMark(h.label, q), h.sub, h.count)).join("")
      : `<div class="rg-empty"><b>‘${q}’에 맞는 지역이 없어요</b><span>시·도나 시·군·구 이름으로 검색해 보세요</span></div>`;
  } else {
    const r = rgFind(rgActive);
    const all = rgLive(r);
    const on = all.length > 0 && all.every((t) => rgDraft.includes(t) || rgDraft.includes(r.name));
    const some = !on && all.some((t) => rgIsOn(t));
    rgListEl.innerHTML = rgRow(r.name, r.name + " 전체", "", r.count, "rg-all" + (some ? " is-part" : ""))
      + r.units.map((u) => rgRow(r.name + ">" + u.name, u.name, "", u.count)).join("");
  }
  rgListEl.scrollTop = keepScroll ? top : 0;
}
const RG_CAP = 1000;   // 이 이상은 정확한 수를 세는 의미가 없어 'N개 이상'으로 끊는다
function rgRenderFoot() {
  const n = rgDraft.length ? rgSumOf(rgDraft) : rgTotal();
  rgApplyBtn.textContent = n >= RG_CAP
    ? `${RG_CTA_NOUN} ${RG_CAP.toLocaleString()}개 이상 보기`
    : `${RG_CTA_NOUN} ${n.toLocaleString()}개 보기`;
  rgResetBtn.disabled = !rgDraft.length;
}
function rgRender(keepScroll) { rgRenderRail(); rgRenderList(keepScroll); rgRenderFoot(); }
function rgSyncChip() { updateChip("region"); rgFilter.querySelector(".chip-label").textContent = rgSummary(); }

/* 패널이 560px라 칩 위치에 따라 오른쪽으로 넘칠 수 있어 뷰포트 안으로 당겨준다 */
function rgPlace() {
  rgPop.style.left = "0px";
  const r = rgPop.getBoundingClientRect();
  const over = r.right - (window.innerWidth - 16);
  if (over > 0) rgPop.style.left = -Math.min(over, Math.max(0, r.left - 16)) + "px";
}
window.addEventListener("resize", rgPlace);

/* 칩을 열 때마다 현재 적용값을 드래프트로 복사 (chipsWrap 위임 핸들러보다 먼저 실행됨) */
rgFilter.querySelector(".chip-btn").addEventListener("click", () => {
  rgDraft = [...applied.region];
  rgQuery = ""; rgInput.value = "";
  if (rgDraft.length) rgActive = rgDraft[0].split(">")[0];
  rgRender();
  requestAnimationFrame(rgPlace);
});
/* 레일·리스트는 클릭 즉시 다시 그려져 타깃이 DOM에서 떨어져 나간다.
   그대로 두면 바깥 클릭 판정(closest(".filter"))이 실패해 팝오버가 닫히므로 여기서 전파를 끊는다. */
rgRail.addEventListener("click", (e) => {
  e.stopPropagation();
  const b = e.target.closest(".rg-sido"); if (!b || b.disabled) return;
  rgActive = b.dataset.sido; rgQuery = ""; rgInput.value = "";
  rgRenderRail(); rgRenderList();
});
rgListEl.addEventListener("click", (e) => {
  e.stopPropagation();
  const b = e.target.closest(".rg-row"); if (!b || b.disabled) return;
  rgToggle(b.dataset.token);
  if (rgQuery) rgActive = b.dataset.token.split(">")[0];   // 검색을 지우면 방금 고른 시·도로 돌아가게
  rgRender(true);
});
rgInput.addEventListener("input", () => { rgQuery = rgInput.value.trim(); rgRenderList(); rgRenderRail(); });
rgInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); rgApplyBtn.click(); } });
rgClear.addEventListener("click", (e) => { e.stopPropagation(); rgInput.value = ""; rgQuery = ""; rgRenderList(); rgRenderRail(); rgInput.focus(); });
rgResetBtn.addEventListener("click", (e) => { e.stopPropagation(); rgDraft = []; rgRender(); });
rgApplyBtn.addEventListener("click", () => {
  applied.region = [...rgDraft];
  rgSyncChip(); closePops(); applyView();
});
rgRender();
document.getElementById("count").textContent = LIVE.length;

const countEl = document.getElementById("count");
const emptyEl = document.getElementById("empty");
function closePops() {
  chipsWrap.querySelectorAll(".filter-pop.is-open").forEach((p) => p.classList.remove("is-open"));
  chipsWrap.querySelectorAll('.chip-btn[aria-expanded="true"]').forEach((b) => b.setAttribute("aria-expanded", "false"));
}

/* 저장 목록은 12개뿐이라 실제로 걸러낸다.
   취향은 탐색 화면과 마찬가지로 개인화 기준값이라 결과를 좁히지 않는다. */
let owner = "all";
function hit(r) {
  if (owner !== "all" && r.owner !== owner) return false;
  if (applied.region.length) {
    const ok = applied.region.some((t) => { const [sd, ut] = t.split(">"); return ut ? (r.sido === sd && r.unit === ut) : r.sido === sd; });
    if (!ok) return false;
  }
  if (applied.period.length && !applied.period.includes(r.period)) return false;
  if (applied.pace.length && !applied.pace.includes(r.pace)) return false;
  if (applied.theme.length && !applied.theme.includes(r.theme)) return false;
  return true;
}
function applyView() {
  grid.style.opacity = "0";
  setTimeout(() => {
    [...grid.children].forEach((el) => { el.hidden = !hit(ROUTES[+el.dataset.i]); });
    refreshCount();
    grid.style.opacity = "1";
  }, 180);
}

/* 저장 토글처럼 목록 구성이 그대로일 때는 이것만 부른다 — 그리드를 페이드시키지 않는다 */
function refreshCount() {
  const shown = [...grid.children].filter((el) => !el.hidden).length;
  countEl.textContent = shown;   // 하트를 눌러도 목록은 그대로 → 개수도 그대로. 해제는 다음 방문에 반영된다
  emptyEl.hidden = shown > 0;
}

/* 남이 만든 / 직접 만든 세그먼트 — 흰 pill이 슬라이드로 이동 */
const ownerSeg = document.getElementById("ownerSeg");
const segThumb = document.createElement("span");
segThumb.className = "seg-thumb";
segThumb.setAttribute("aria-hidden", "true");
ownerSeg.prepend(segThumb);
function placeThumb(seg, instant) {
  if (instant) segThumb.style.transition = "none";
  segThumb.style.width = seg.offsetWidth + "px";
  segThumb.style.transform = "translateX(" + seg.offsetLeft + "px)";
  if (instant) { void segThumb.offsetWidth; segThumb.style.transition = ""; }
}
function repositionThumb() { const a = ownerSeg.querySelector(".seg.is-active"); if (a) placeThumb(a, true); }
requestAnimationFrame(repositionThumb);
window.addEventListener("load", repositionThumb);
window.addEventListener("resize", repositionThumb);
ownerSeg.addEventListener("click", (e) => {
  const btn = e.target.closest(".seg"); if (!btn) return;
  ownerSeg.querySelectorAll(".seg").forEach((x) => x.classList.remove("is-active"));
  btn.classList.add("is-active");
  placeThumb(btn, false);
  owner = btn.dataset.owner;
  applyView();
});

/* 하트 = 저장 토글. 목록에서 지우지 않고 다음 방문에 반영한다. */
grid.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-unsave]"); if (!btn) return;
  e.preventDefault(); e.stopPropagation();
  const card = btn.closest(".route-card");
  const r = ROUTES[+card.dataset.i], name = r.name, key = keyOf(r);
  const saved = !card.classList.contains("is-saved");
  card.classList.toggle("is-saved", saved);
  btn.setAttribute("aria-pressed", saved ? "true" : "false");
  btn.setAttribute("aria-label", `${name} ${saved ? "저장 해제" : "다시 저장"}`);
  saved ? unsaved.delete(key) : unsaved.add(key);
  writeUnsaved(new Set([...dropped, ...unsaved]));
});

/* 필터 드롭다운 (다중선택) */
chipsWrap.addEventListener("click", (e) => {
  const chipBtn = e.target.closest(".filter > .chip-btn");
  const opt = e.target.closest(".filter-opt");
  if (chipBtn) {
    e.stopPropagation();
    const filter = chipBtn.parentElement;
    const key = filter.dataset.key;
    // 선택이 있는 상태에서 X(=.caret 자리) 클릭 → 전체 해제
    if (e.target.closest(".caret") && applied[key].length) { applied[key] = []; updateChip(key); closePops(); applyView(); return; }
    const pop = filter.querySelector(".filter-pop");
    const willOpen = !pop.classList.contains("is-open");
    closePops();
    if (willOpen) { pop.classList.add("is-open"); chipBtn.setAttribute("aria-expanded", "true"); }
    return;
  }
  if (opt) {
    e.stopPropagation();
    const filter = opt.closest(".filter");
    const key = filter.dataset.key;
    const val = opt.dataset.value;
    const arr = applied[key];
    const i = arr.indexOf(val);
    if (i >= 0) arr.splice(i, 1); else arr.push(val);
    updateChip(key);      // 드롭다운은 열어둔 채로 여러 개 토글
    applyView();
    return;
  }
});
document.addEventListener("click", (e) => { if (!e.target.closest(".filter")) closePops(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePops(); });

/* ---------- 프로필 팝오버 ---------- */
const pill = document.getElementById("profilePill");
const pop = document.getElementById("profilePop");
pill.addEventListener("click", (e) => {
  e.stopPropagation();
  const open = pop.classList.toggle("is-open");
  pill.setAttribute("aria-expanded", open ? "true" : "false");
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".profile")) { pop.classList.remove("is-open"); pill.setAttribute("aria-expanded", "false"); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { pop.classList.remove("is-open"); pill.setAttribute("aria-expanded", "false"); } });
</script>

<div class="modal-scrim" id="makeModal" hidden>
  <div class="modal-box modal-w-lg" role="dialog" aria-modal="true" aria-labelledby="rmTitle">

      <h2 id="rmTitle">동선 만들기</h2>
      <button class="modal-close" type="button" aria-label="닫기"><svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg></button>
    </div>
    <div class="rm-opts" role="radiogroup" aria-labelledby="rmTitle">
      <button class="rm-opt is-on" type="button" role="radio" aria-checked="true" data-mode="ai">
        <span class="rm-ic" aria-hidden="true"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M240,128a15.79,15.79,0,0,1-10.5,15l-63.44,23.06L143,229.5a16,16,0,0,1-30,0L89.94,166.06,26.5,143a16,16,0,0,1,0-30l63.44-23.06L113,26.5a16,16,0,0,1,30,0l23.06,63.44L229.5,113A15.79,15.79,0,0,1,240,128Z"/></svg></span>
        <span class="rm-tx"><b>AI에게 여행지 추천 받기</b><span>내 취향과 조건에 맞는 여행지를 추천해드려요</span></span>
      </button>
      <button class="rm-opt" type="button" role="radio" aria-checked="false" data-mode="region">
        <span class="rm-ic" aria-hidden="true"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M128,16a88.1,88.1,0,0,0-88,88c0,75.3,80,132.17,83.41,134.55a8,8,0,0,0,9.18,0C136,236.17,216,179.3,216,104A88.1,88.1,0,0,0,128,16Zm0,56a32,32,0,1,1-32,32A32,32,0,0,1,128,72Z"/></svg></span>
        <span class="rm-tx"><b>원하는 지역의 동선 추천 받기</b><span>선택한 지역 안에서 취향에 맞는 동선을 만들어드려요</span></span>
      </button>
      <button class="rm-opt" type="button" role="radio" aria-checked="false" data-mode="saved">
        <span class="rm-ic" aria-hidden="true"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M240,94c0,70-103.79,126.66-108.21,129a8,8,0,0,1-7.58,0C119.79,220.66,16,164,16,94A62.07,62.07,0,0,1,78,32c20.65,0,38.73,8.88,50,23.89C139.27,40.88,157.35,32,178,32A62.07,62.07,0,0,1,240,94Z"/></svg></span>
        <span class="rm-tx"><b>찜한 장소로 동선 추천 받기</b><span>찜한 장소를 포함해 이동하기 좋은 동선을 만들어드려요</span></span>
      </button>
    </div>
    <div class="modal-foot"><button class="rm-next" type="button">다음</button></div>
  </div>
</div>
<script>
/* 동선 만들기 진입 — 배너·버튼 어디서 눌러도 같은 모달이 뜬다.
   [다음]을 누르면 고른 방식에 맞는 조건 입력 화면으로 넘어간다. */
(function () {
  const scrim = document.getElementById("makeModal");
  const opts = [...scrim.querySelectorAll(".rm-opt")];
  let opener = null;
  function open(trigger) {
    opener = trigger;
    scrim.hidden = false;
    void scrim.offsetWidth;   // 강제 리플로우 — 백그라운드 탭에서 rAF가 멈춰도 전이가 시작되게
    scrim.classList.add("is-open");
    (scrim.querySelector(".rm-opt.is-on") || opts[0]).focus();
  }
  function close() {
    scrim.classList.remove("is-open");
    setTimeout(() => { scrim.hidden = true; if (opener) opener.focus(); }, 160);
  }
  document.addEventListener("click", (e) => {
    const trigger = e.target.closest("[data-make-route]");
    if (trigger) { e.preventDefault(); open(trigger); return; }
    if (scrim.hidden) return;
    if (e.target.closest(".rm-next")) {
      const on = scrim.querySelector(".rm-opt.is-on");
      const mode = on ? on.dataset.mode : "ai";
      try { localStorage.removeItem("scentrip_route_draft"); } catch (x) {}   // 새로 시작하는 것이니 지난 답은 버린다
      // 찜한 장소 방식만 장소를 먼저 고르고, 나머지는 바로 조건 입력으로 간다
      location.href = mode === "saved" ? "route-create.html" : "route-conditions.html?mode=" + mode;
      return;
    }
    if (e.target === scrim || e.target.closest(".modal-close")) { close(); return; }
    const opt = e.target.closest(".rm-opt");
    if (opt) opts.forEach((o) => { const on = o === opt; o.classList.toggle("is-on", on); o.setAttribute("aria-checked", on ? "true" : "false"); });
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !scrim.hidden) close(); });
})();
</script>
<script>
/* 가입 때 정한 닉네임을 헤더 프로필에 반영 (signup.html 에서 저장) */
