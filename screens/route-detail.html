<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scentrip — 여행 동선 상세</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../reference/tokens.css">
<link rel="stylesheet" href="../reference/components.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../reference/places.js"></script>
<script src="../reference/map-adapter.js"></script>
<style>
/* 여행 동선 상세(route-detail.html) — 동선 결과 화면(route-result.html)의 스타일을 그대로 가져왔다(편집 전용 규칙 일부 포함).
   이 화면에만 쓰는 규칙은 맨 아래 '동선 상세 전용'. 다시 만들 때: 이 파일은 route-result 에서 조립했다. */
/* ============================================================
   Scentrip — AI 맞춤 동선 · 결과 화면 (PRD_동선추천결과.md)
   2분할 레이아웃(좌: 일차별 동선 / 우: 지도) · 결과 헤더 · 일차 탭 · 요약 · 로딩 · 지도.
   여행 조건은 헤더의 '여행 조건' 버튼 → 모달에서 수정한다.
   타임라인 노드(카드 액션·구간 이동시간·숙소)와 편집·저장은 다음 단계.
   조건은 위저드가 localStorage("scentrip_route_cond")로 넘긴다.
   웹 전용 · 최소 폭 1280px.
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-family); letter-spacing: var(--letter-spacing);
  color: var(--color-content-default); background: var(--color-background);
  -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: break-word;
  min-width: 1280px;
}
ul, ol { list-style: none; }
button { font: inherit; letter-spacing: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.page { display: flex; flex-direction: column; align-items: stretch; width: 100%; min-height: 100vh; }
html .guest-only { display: none; }
.is-guest .auth-only { display: none; }
.is-guest .guest-only { display: flex; }

.guest-gate { flex: 1 0 auto; display: flex; align-items: center; justify-content: center; padding: 80px var(--space-24); }
.gate-card { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-16); max-width: 420px; }
.gate-icon { display: flex; width: 56px; height: 56px; align-items: center; justify-content: center; border-radius: var(--radius-full); background: var(--color-surface-01); color: var(--color-primary); }
.gate-icon svg { width: 28px; height: 28px; }
.gate-card h1 { font-size: var(--text-title-28); font-weight: 600; line-height: 1.3; }
.gate-card p { font-size: var(--text-body-16); line-height: 1.7; color: var(--color-content-neutral-muted); }
.btn-login { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 var(--space-24); border-radius: var(--radius-full); background: var(--color-primary); color: var(--color-base-white); font-size: var(--text-body-16); font-weight: 600; text-decoration: none; }
.btn-login:hover { background: var(--color-primary-hover); }
.type-pill { display: flex; align-items: center; gap: var(--space-8); height: 38px; padding: 0 var(--space-6) 0 var(--space-12); border-radius: var(--radius-full); background: var(--color-surface-01); }
.profile { position: relative; }
.profile-pop { width: 280px; padding: var(--space-8); }

/* ---------- 상단 헤더 고정 (길찾기 링크도 .nav 라서 상단 내비만 따로 잡는다) ---------- */
.rr-nav { position: sticky; top: 0; z-index: 800; border-bottom: 1px solid var(--color-border-subtle); }

/* ---------- 2분할 (좌: 일차별 동선 / 우: 지도, 1:1) ---------- */
.rr-wrap { flex: 1 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
.rr-main { min-width: 0; padding: var(--space-32); }
.rr-mapcol { position: sticky; top: 56px; height: calc(100vh - 56px - var(--save-bar-h));   /* 하단 저장 바만큼 줄여 지도 아래가 가려지지 않게 */ border-left: 1px solid var(--color-border-subtle); }

/* ---------- 조건 (여행 조건 수정 모달에서 사용) ---------- */
.cond-group + .cond-group { margin-top: var(--space-4); padding-top: var(--space-20); border-top: 1px solid var(--color-border-subtle); }
.cond-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-12); padding: var(--space-6) 0; min-height: 40px; }
.cond-row dt { flex: none; font-size: 13px; font-weight: 500; color: var(--color-content-subtle); }
.cond-row dd { font-size: var(--text-body-14); font-weight: 600; text-align: right; }
.cond-note { margin-top: var(--space-10); font-size: var(--text-caption-12); line-height: 1.6; color: var(--color-content-subtle); }

/* ---------- 결과 헤더 ---------- */
.rr-head { display: flex; align-items: flex-start; gap: var(--space-16); }
.rr-head-tx { flex: 1 1 auto; min-width: 0; }
.rr-title { display: flex; align-items: center; gap: var(--space-12); }
.rr-title h2 { font-size: var(--text-heading-24); font-weight: 600; line-height: 1.3; color: var(--color-content-default); }
.match-badge { display: inline-flex; align-items: center; gap: var(--space-6); padding: var(--space-4) var(--space-10); border: 1px solid var(--color-border-default); border-radius: var(--radius-full); background: var(--color-surface-overlay); color: var(--color-content-subtle); font-size: var(--text-body-14); font-weight: 600; line-height: 1.5; }
.match-badge svg { width: 14px; height: 14px; }
.dirty-badge { display: inline-flex; align-items: center; height: 26px; padding: 0 var(--space-10); border-radius: var(--radius-full); background: var(--color-neutral-subtle); color: var(--color-content-neutral-muted); font-size: var(--text-caption-12); font-weight: 600; }
.dirty-badge[hidden] { display: none; }
.rr-lead { margin-top: var(--space-4); font-size: var(--text-body-16); line-height: 1.5; color: var(--color-content-neutral); }
.rr-conceptrow { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-10); margin-top: var(--space-16); }
.rr-concept { display: inline-flex; align-items: center; gap: var(--space-8); padding: var(--space-12) var(--space-16); border-radius: var(--radius-lg); background: var(--color-primary-subtle); font-size: var(--text-body-14); line-height: 1.5; color: var(--color-content-neutral); }
.rr-concept svg { width: 20px; height: 20px; flex: none; color: var(--color-primary); }
.rr-concept b { flex: none; font-weight: 600; color: var(--color-primary); }
.rr-conceptrow .reco-again { border: 1px solid var(--color-neutral-border); }

/* '다른 지역으로 다시 추천' 버튼 (AI 모드에서 컨셉 박스 옆) */
.reco-again { flex: none; height: 40px; padding: 0 var(--space-16); border-radius: var(--radius-full); background: var(--color-surface-overlay); font-size: 13px; font-weight: 600; color: var(--color-primary); }
.reco-again:hover { background: var(--color-state-hover-brand); }

/* ---------- 일차 탭 (스크롤 시 상단 고정) ---------- */
.day-tabs { position: sticky; top: 56px; z-index: 10; display: flex; gap: var(--space-8); margin-top: var(--space-24); background: var(--color-background); border-bottom: 1px solid var(--color-border-subtle); }
.day-tab { position: relative; display: flex; flex-direction: column; gap: 2px; padding: var(--space-12) var(--space-16); font-size: var(--text-body-16); font-weight: 500; color: var(--color-content-neutral-subtle); }
.day-tab b { font-weight: inherit; }
.day-tab small { font-size: var(--text-caption-11); font-weight: 500; color: var(--color-content-subtle); }
.day-tab.is-on { font-weight: 600; color: var(--color-content-default); }
.day-tab.is-on::after { content: ""; position: absolute; left: var(--space-12); right: var(--space-12); bottom: -1px; height: 2px; background: var(--color-primary); }

/* ---------- 일차 요약 ---------- */
.day-sum { margin-top: var(--space-24); }
.day-sum h3 { font-size: var(--text-body-16); font-weight: 600; color: var(--color-content-default); }

/* ---------- 타임라인 ---------- */
.tl-area { position: relative; min-height: 420px; margin-top: var(--space-20); }
.tl-list { display: flex; flex-direction: column; }

/* 한 줄 = 왼쪽 레일(점선 + 동그라미) + 오른쪽 내용. 출발지·장소·이동·숙소가 같은 축을 쓴다 */
.tl-row { position: relative; display: flex; align-items: center; gap: var(--space-12); }
.tl-rail { position: relative; align-self: stretch; display: flex; align-items: center; flex: none; padding: 0 var(--space-12); }
.tl-rail::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; transform: translateX(-50%); border-left: 2px dashed var(--color-neutral-border); }
.tl-node { position: relative; z-index: 1; display: flex; width: 28px; height: 28px; flex: none; align-items: center; justify-content: center; border-radius: var(--radius-full); background: var(--color-neutral-bg); color: var(--color-content-neutral-muted); font-size: 13px; font-weight: 600; }
.tl-node svg { width: 16px; height: 16px; }
.tl-node.is-num { background: var(--color-primary); color: var(--color-base-white); }
.tl-node.is-pin { background: var(--color-surface-02); color: var(--color-content-muted); }

/* 흰 카드 (출발지·장소·숙소 공용) */
.tl-cardwrap { flex: 1 1 auto; min-width: 0; padding: var(--space-8) 0; }
.tl-card { position: relative; display: flex; align-items: center; gap: var(--space-12); padding: var(--space-16); border: 1px solid var(--color-neutral-subtle); border-radius: var(--radius-lg); background: var(--color-background); box-shadow: var(--elevation-sm); transition: box-shadow .18s ease, border-color .18s ease; }
.tl-card-tx { flex: 1 1 auto; min-width: 0; }
.tl-card-title { font-size: var(--text-body-16); font-weight: 600; line-height: 1.5; color: var(--color-content-default); }
.tl-card-desc { margin-top: 2px; font-size: var(--text-body-14); line-height: 1.6; color: var(--color-content-neutral-muted); }
.tl-card-desc b { font-weight: 600; color: var(--color-content-default); }

/* 카드·구간 오른쪽 텍스트 버튼 (출발지 설정 · 숙소 설정 · 길찾기) */
.tl-link { display: inline-flex; align-items: center; gap: var(--space-8); flex: none; height: 36px; padding: 0 var(--space-16); border-radius: var(--radius-full); font-size: var(--text-body-14); font-weight: 500; line-height: 1.5; color: var(--color-content-interactive); text-decoration: none; white-space: nowrap; transition: background .14s ease, color .14s ease; }
.tl-link svg { width: 16px; height: 16px; transition: transform .16s ease; }
.tl-link:hover { background: var(--color-state-hover-brand); color: var(--color-content-interactive-hover); }
.tl-link:hover svg { transform: translateX(2px); }
.tl-link:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }

/* 장소 카드 */
.tl-item { transition: opacity .14s ease; }
.tl-item .tl-card { align-items: flex-start; gap: var(--space-16); }
.tl-item:hover .tl-card, .tl-item.is-hot .tl-card, .tl-item:focus-within .tl-card { border-color: var(--color-border-subtle); box-shadow: var(--elevation-md); }
.tl-item.is-dragging { opacity: .5; }
.tl-item.is-over .tl-card { border-color: var(--color-primary); box-shadow: 0 0 0 1px var(--color-primary), var(--elevation-md); }
/* 드래그 핸들 — 레일 바깥 왼쪽에 두어 동그라미·점선 정렬을 방해하지 않는다 */
.tl-grip { position: absolute; left: -22px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; width: 18px; height: 40px; color: var(--color-content-subtle); cursor: grab; opacity: 0; transition: opacity .14s ease; }
.tl-grip svg { width: 18px; height: 18px; }
.tl-item:hover .tl-grip { opacity: 1; }
.tl-item:active .tl-grip { cursor: grabbing; }
.tl-thumb { width: 72px; height: 72px; flex: none; border-radius: var(--radius-md); object-fit: cover; background: var(--color-neutral-subtle); }
.tl-body { flex: 1 1 auto; min-width: 0; }
.tl-name { display: flex; align-items: center; gap: var(--space-8); font-size: var(--text-body-16); font-weight: 600; line-height: 1.5; color: var(--color-content-default); }
.tl-name a { color: inherit; text-decoration: none; }
.tl-name a:hover { text-decoration: underline; }
.tl-match { display: inline-flex; align-items: center; gap: var(--space-4); flex: none; padding: 3px var(--space-8); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-full); background: var(--color-surface-overlay); font-size: var(--text-caption-12); font-weight: 600; line-height: 1.5; color: var(--color-content-subtle); }
.tl-match svg { width: 12px; height: 12px; }
.tl-packed { display: inline-flex; align-items: center; height: 20px; padding: 0 var(--space-6); border-radius: var(--radius-sm); background: var(--color-neutral-subtle); font-size: var(--text-caption-11); font-weight: 600; color: var(--color-content-subtle); }
.tl-desc { margin-top: 2px; font-size: var(--text-body-14); line-height: 1.6; color: var(--color-content-neutral-muted); }
.tl-tags { display: flex; flex-wrap: wrap; gap: var(--space-6); margin-top: var(--space-8); }
.tl-tags span { display: inline-flex; align-items: center; height: 24px; padding: 0 var(--space-8); border-radius: var(--radius-full); background: var(--color-neutral-bg); font-size: var(--text-caption-11); font-weight: 500; color: var(--color-content-neutral-muted); }

/* 카드 더보기(⋯) — 호버·포커스 때만 우측 상단(썸네일 모서리 위)에 뜬다. 안에 시간대·일차 이동·장소 변경·삭제 */
.tl-more { position: absolute; top: var(--space-20); right: var(--space-20); z-index: 2; opacity: 0; pointer-events: none; transform: scale(.9); transition: opacity .16s ease, transform .16s ease; }
.tl-item:hover .tl-more, .tl-item:focus-within .tl-more, .tl-more:has(.menu.is-open) { opacity: 1; pointer-events: auto; transform: none; }
.tl-more:has(.menu.is-open) { z-index: 5; }
.tl-more-btn { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: var(--radius-full); background: var(--color-surface-overlay); color: var(--color-content-neutral); box-shadow: var(--elevation-sm); transition: background .14s ease; }
.tl-more-btn svg { width: 20px; height: 20px; }
.tl-more-btn:hover, .tl-more-btn[aria-expanded="true"] { background: var(--color-neutral-subtle); }
.tl-more-btn:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }
.tl-more .menu { top: calc(100% + 6px); right: 0; left: auto; min-width: 180px; }
.tl-more .menu-label { padding: var(--space-8) var(--space-12) var(--space-4); font-size: var(--text-caption-11); font-weight: 600; color: var(--color-content-neutral-subtle); }
.tl-more .menu-sep { height: 1px; margin: var(--space-6) 0; background: var(--color-border-subtle); }
.tl-more .menu-item .ic { display: inline-flex; align-items: center; gap: var(--space-8); }
.tl-more .menu-item .ic svg { width: 16px; height: 16px; }
.tl-more .menu-item.danger { color: var(--color-content-error); }
.tl-more .menu-item.danger:hover { background: var(--color-error-subtle); }
@media (hover: none) { .tl-more { opacity: 1; pointer-events: auto; transform: none; } }

/* 이동 구간 — 레일 동그라미에 이동 수단 아이콘, 오른쪽에 길찾기 */
.tl-seg-tx { display: flex; align-items: center; gap: var(--space-10); flex: 1 1 auto; min-width: 0; padding: var(--space-24) var(--space-16); }
.tl-seg-info { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-8); flex: 1 1 auto; min-width: 0; }
.tl-seg-time { display: inline-flex; align-items: center; gap: var(--space-4); font-size: var(--text-body-14); line-height: 1.5; }
.tl-seg-time .mode { flex: none; color: var(--color-content-neutral-muted); }
.tl-seg-time .dot { flex: none; color: var(--color-content-neutral-subtle); }
.tl-seg-time .min { font-weight: 500; color: var(--color-content-neutral); }
.tl-seg .alt { font-size: var(--text-caption-12); color: var(--color-content-neutral-subtle); white-space: nowrap; }
.tl-seg .warn { display: inline-flex; align-items: center; gap: var(--space-4); height: 22px; padding: 0 var(--space-8); border-radius: var(--radius-full); background: var(--color-warning-subtle); font-size: var(--text-caption-11); font-weight: 600; color: var(--color-content-neutral); white-space: nowrap; }
.tl-seg .warn svg { width: 12px; height: 12px; color: var(--color-warning); }

/* 교체·추가 패널 (PRD 4.7 / 4.8) */
.cand { margin: var(--space-8) 0 var(--space-8) calc(28px + var(--space-24) + var(--space-12)); padding: var(--space-16); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-lg); background: var(--color-neutral-bg); }
.cand-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-12); }
.cand-head b { font-size: var(--text-body-14); font-weight: 600; }
.cand-head .close { font-size: var(--text-caption-11); font-weight: 600; color: var(--color-content-neutral-muted); }
.cand-head .close:hover { color: var(--color-content-default); text-decoration: underline; }
.cand-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-12); margin-top: var(--space-12); }
.cand-card { display: flex; flex-direction: column; padding: var(--space-10); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-md); background: var(--color-surface-overlay); text-align: left; }
.cand-card img { width: 100%; height: 76px; border-radius: var(--radius-sm); object-fit: cover; background: var(--color-neutral-subtle); }
.cand-card .nm { margin-top: var(--space-8); font-size: 13px; font-weight: 600; line-height: 1.4; }
.cand-card .sc { display: flex; flex-wrap: wrap; gap: var(--space-4); margin-top: var(--space-6); }
.cand-card .sc span { display: inline-flex; align-items: center; height: 20px; padding: 0 var(--space-6); border-radius: var(--radius-full); background: var(--color-neutral-bg); font-size: var(--text-caption-11); color: var(--color-content-neutral-muted); }
.cand-card .mt { margin-top: var(--space-6); font-size: var(--text-caption-11); font-weight: 600; color: var(--color-primary); }
.cand-card .dt { margin-top: 2px; font-size: var(--text-caption-11); color: var(--color-content-subtle); }
.cand-card .far { margin-top: var(--space-6); font-size: var(--text-caption-11); font-weight: 600; line-height: 1.4; color: var(--color-content-neutral); }
.cand-pick { margin-top: var(--space-10); height: 32px; border-radius: var(--radius-full); background: var(--color-primary); color: var(--color-base-white); font-size: var(--text-caption-12); font-weight: 600; }
.cand-pick:hover { background: var(--scent-green-700); }
.cand-foot { display: flex; justify-content: center; margin-top: var(--space-12); }
.cand-more { height: 32px; padding: 0 var(--space-16); border-radius: var(--radius-full); border: 1px solid var(--color-neutral-border); background: var(--color-surface-overlay); font-size: var(--text-caption-12); font-weight: 600; color: var(--color-content-neutral); }
.cand-more:hover { background: var(--color-neutral-subtle); }
.cand-none { margin-top: var(--space-12); font-size: 13px; line-height: 1.6; color: var(--color-content-neutral-muted); }

/* 빈자리 (PRD 4.8) */
.tl-gap { display: flex; align-items: center; gap: var(--space-12); margin: var(--space-8) 0 var(--space-8) calc(28px + var(--space-24) + var(--space-12)); padding: var(--space-16); border: 1px dashed var(--color-neutral-border); border-radius: var(--radius-lg); }
.tl-gap .tx { flex: 1 1 auto; font-size: 13px; color: var(--color-content-neutral-muted); }
.tl-gap .add { height: 32px; padding: 0 var(--space-12); border-radius: var(--radius-full); border: 1px solid var(--color-primary); font-size: var(--text-caption-12); font-weight: 600; color: var(--color-primary); }
.tl-gap .add:hover { background: var(--color-state-hover-brand); }
.tl-gap .dismiss { font-size: var(--text-caption-11); font-weight: 600; color: var(--color-content-subtle); }
.tl-gap .dismiss:hover { color: var(--color-content-default); text-decoration: underline; }

/* 숙소·출발지 — 장소 카드와 같은 흰 카드(.tl-card), 레일 동그라미만 옅은 그린(.tl-node.is-pin) */
.tl-stay .undecided { font-size: var(--text-caption-11); font-weight: 600; color: var(--color-content-subtle); }
.tl-origin .tl-card-desc { line-height: 1.5; color: var(--color-content-neutral); }
/* 출발 설정 모달 필드 */
.origin-fields { display: flex; flex-direction: column; gap: var(--space-16); }
.origin-field { display: flex; flex-direction: column; gap: var(--space-6); }
.origin-field > span { font-size: var(--text-caption-12); font-weight: 600; color: var(--color-content-subtle); }
.origin-field input { height: 44px; padding: 0 var(--space-12); border: 1px solid var(--color-neutral-border); border-radius: var(--radius-md); background: var(--color-surface-overlay); font: inherit; letter-spacing: inherit; font-size: var(--text-body-14); color: var(--color-content-default); }
.origin-field input:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 1px; }

/* 인라인 편집 (출발지·숙소 공용) */
.stay-input { width: 100%; height: 36px; margin-top: var(--space-6); padding: 0 var(--space-12); border-radius: var(--radius-md); border: 1px solid var(--color-neutral-border); background: var(--color-surface-overlay); font: inherit; letter-spacing: inherit; font-size: var(--text-body-14); color: var(--color-content-default); }
.stay-input:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 1px; }
.stay-actions { display: flex; align-items: center; gap: var(--space-6); flex: none; align-self: flex-end; }
.stay-save { height: 36px; padding: 0 var(--space-16); border-radius: var(--radius-full); background: var(--color-primary); color: var(--color-base-white); font-size: var(--text-caption-12); font-weight: 600; }
.stay-save:hover { background: var(--scent-green-700); }
.stay-cancel { height: 36px; padding: 0 var(--space-16); border-radius: var(--radius-full); font-size: var(--text-caption-12); font-weight: 600; color: var(--color-content-neutral-muted); }
.stay-cancel:hover { background: var(--color-neutral-subtle); color: var(--color-content-default); }
.tl-stay.is-edit { align-items: flex-end; }
.tl-empty { display: flex; flex-direction: column; align-items: center; gap: var(--space-8); padding: 80px var(--space-24); text-align: center; }
.tl-empty b { font-size: var(--text-body-16); font-weight: 600; }
.tl-empty p { font-size: var(--text-body-14); color: var(--color-content-neutral-muted); }
.tl-empty[hidden] { display: none; }

/* 다음 단계 안내 — 뼈대에서만 보인다 */
.tl-todo { margin-top: var(--space-24); padding: var(--space-16); border: 1px dashed var(--color-neutral-border); border-radius: var(--radius-lg); font-size: 13px; line-height: 1.7; color: var(--color-content-subtle); }

/* 생성 중 오버레이 — 타임라인 자리만 덮는다 (PRD 4.2 / 4.13) */
.tl-load { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-12); background: var(--color-surface-overlay); }
.tl-load[hidden] { display: none; }
.tl-load b { font-size: var(--text-body-16); font-weight: 600; }
.tl-load p { font-size: var(--text-body-14); color: var(--color-content-neutral-muted); }
.spinner { width: 28px; height: 28px; border: 3px solid var(--color-neutral-border); border-top-color: var(--color-primary); border-radius: var(--radius-full); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- 지도 ---------- */
.rr-map { position: relative; width: 100%; height: 100%; background: var(--color-neutral-bg); }
.rr-map-canvas { position: absolute; inset: 0; }
.leaflet-container { background: var(--color-neutral-bg); font-family: var(--font-family); }
.leaflet-tile { filter: saturate(.72) brightness(1.03); }   /* 원색을 눌러 핀이 먼저 읽히게 */
.leaflet-div-icon { background: none; border: 0; }
.leaflet-control-attribution { font-size: 10px; background: var(--alpha-white-70); }
.leaflet-control-zoom a { color: var(--color-content-neutral); }
.rr-map-note { position: absolute; z-index: 500; left: var(--space-12); bottom: var(--space-12); padding: var(--space-4) var(--space-10); border-radius: var(--radius-full); background: var(--alpha-white-70); backdrop-filter: blur(4px); font-size: var(--text-caption-11); font-weight: 500; color: var(--color-content-neutral-muted); }
.rr-map-fail { position: absolute; inset: 0; z-index: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-8); padding: var(--space-24); text-align: center; background: var(--color-neutral-bg); }
.rr-map-fail[hidden] { display: none; }
.rr-map-fail b { font-size: var(--text-body-14); font-weight: 600; }
.rr-map-fail p { font-size: 13px; line-height: 1.6; color: var(--color-content-neutral-muted); }

/* 지도 핀 — 내 여행과 같은 모양 */
.pin { position: relative; display: block; width: 26px; height: 34px; color: var(--color-primary); border: 0; background: none; padding: 0; }
.pin svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 4px rgba(27,35,29,.18)); transform-origin: 50% 100%; transition: transform .16s cubic-bezier(.22,.61,.36,1); }
.pin .no { position: absolute; left: 0; right: 0; top: 5px; text-align: center; font-size: var(--text-caption-11); font-weight: 700; color: var(--color-base-white); }
.pin:hover, .pin.is-on { color: var(--color-primary-active); }
.pin:hover svg, .pin.is-on svg { transform: scale(1.18); }
.pin-alt { color: var(--color-content-neutral-muted); }   /* 출발지·숙소 등 보조 핀 */

/* 삭제 확인 모달 — 모달 껍데기는 components.css, 버튼만 여기서 */
.modal-body { margin-top: var(--space-12); font-size: var(--text-body-14); font-weight: 400; line-height: 1.7; color: var(--color-content-neutral-muted); }
.modal-body b { font-weight: 600; color: var(--color-content-default); }
.modal-foot { margin-top: var(--space-24); }
.modal-foot button { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 var(--space-20); border-radius: var(--radius-full); font-size: var(--text-body-14); font-weight: 600; }
.btn-ghost { background: none; color: var(--color-content-neutral-muted); }
.btn-ghost:hover { background: var(--color-neutral-subtle); color: var(--color-content-neutral); }
.btn-danger { background: var(--color-error); color: var(--color-base-white); }
.btn-danger:hover { background: var(--color-error-hover); }

/* ---------- 저장 바 ---------- */
/* 화면 전체 너비로 하단에 붙는다(sticky). 위쪽만 라운드, 그림자는 위로 드리운다
   (엘리베이션 토큰은 아래로만 떨어져서, 같은 그린 틴트 #1b231d 로 위 방향만 따로 둔다) */
:root { --save-bar-h: 76px; }
.save-bar { position: sticky; bottom: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: var(--space-16); height: var(--save-bar-h); padding: 0 var(--space-32); border: 1px solid var(--color-border-subtle); border-bottom: 0; border-radius: var(--radius-xl) var(--radius-xl) 0 0; background: var(--color-surface-overlay); box-shadow: 0 -6px 20px -8px rgba(27, 35, 29, .14); }
.save-bar p { font-size: var(--text-body-14); font-weight: 500; color: var(--color-content-neutral-muted); }
.save-btn { height: 44px; padding: 0 var(--space-24); border-radius: var(--radius-full); background: var(--color-primary); color: var(--color-base-white); font-size: var(--text-body-14); font-weight: 600; }
.save-btn:hover { background: var(--scent-green-700); }
/* 저장 완료 — 같은 자리에서 옅은 그린으로 바뀐다 */
.save-btn.is-done { background: var(--color-surface-02); color: var(--color-primary); }
.save-btn.is-done:hover { background: var(--color-surface-02); }
.save-bar p a { font-weight: 600; color: var(--color-primary); text-underline-offset: 3px; }
/* 토스트는 하단 저장 바 위로 띄운다 */
.toast { bottom: calc(var(--save-bar-h) + var(--space-16)); }

/* ---------- 여행 조건: 헤더 버튼 + 수정 모달 ---------- */
.cond-btn { display: inline-flex; align-items: center; gap: var(--space-8); margin-left: auto; flex: none; height: 40px; padding: 0 var(--space-20); border-radius: var(--radius-full); border: 1px solid var(--color-neutral-border); background: var(--color-background); font-size: var(--text-body-14); font-weight: 600; color: var(--color-content-neutral); }
.cond-btn:hover { background: var(--color-neutral-subtle); color: var(--color-content-default); }
.cond-btn svg { width: 16px; height: 16px; }
.cond-modal-body { display: flex; flex-direction: column; }
.cond-sub { margin-bottom: var(--space-4); font-size: var(--text-caption-12); font-weight: 600; color: var(--color-content-subtle); }
/* 조건 모달은 드롭다운 팝오버가 박스 밖으로 나올 수 있게 (overflow 로 잘리던 문제) */
#condModal .modal-box { overflow: visible; }
.cond-modal-body { overflow: visible; }
/* 여행 조건 드롭다운 — 디자인 시스템 chip-btn + menu 사용 */
.cond-drop { position: relative; display: inline-block; }
.cond-drop .chip-btn { height: 40px; font-size: var(--text-body-14); }
.cond-drop .chip-btn.is-active { border-width: 1px; border-color: var(--color-neutral-border); }
.cond-drop .chip-btn.is-active svg { width: 16px; height: 16px; }
.cond-drop .menu { right: 0; left: auto; min-width: 100%; max-height: 260px; overflow-y: auto; }
.cond-foot { display: block; margin-top: 0; }
.cond-foot .cond-cta { width: 100%; height: 48px; border-radius: var(--radius-full); background: var(--color-primary); color: var(--color-base-white); font-size: var(--text-body-16); font-weight: 600; }
.cond-foot .cond-cta:hover { background: var(--scent-green-700); }

/* ---------- 동선 상세 전용 ---------- */
.rd-crumb { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-6); margin-bottom: var(--space-16); font-size: 13px; line-height: 1.5; color: var(--color-content-neutral-muted); }
.rd-crumb a { color: inherit; text-decoration: none; }
.rd-crumb a:hover { color: var(--color-content-default); text-decoration: underline; text-underline-offset: 3px; }
.rd-crumb [aria-current] { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; color: var(--color-content-default); }
.rd-actions { display: flex; gap: var(--space-8); flex: none; margin-left: auto; }
.rd-act { display: inline-flex; align-items: center; gap: var(--space-6); height: 40px; padding: 0 var(--space-16); border: 1px solid var(--color-neutral-border); border-radius: var(--radius-full); background: var(--color-background); font-size: var(--text-body-14); font-weight: 600; color: var(--color-content-neutral); transition: background .14s ease, border-color .14s ease, color .14s ease; }
.rd-act:hover { background: var(--color-neutral-subtle); }
.rd-act svg { width: 16px; height: 16px; }
.rd-act .ic-on { display: none; }
.rd-act[aria-pressed="true"] { border-color: var(--color-primary); background: var(--color-primary-subtle); color: var(--color-primary); }
.rd-act[aria-pressed="true"] .ic-on { display: block; }
.rd-act[aria-pressed="true"] .ic-off { display: none; }
.rd-act[hidden] { display: none; }
.rd-meta { margin-top: var(--space-6); font-size: var(--text-body-14); line-height: 1.5; color: var(--color-content-neutral-muted); }
.day-tabs[hidden] { display: none; }
.rd-empty { padding: var(--space-40) var(--space-16); font-size: var(--text-body-14); color: var(--color-content-neutral-muted); text-align: center; }
.rd-missing { display: flex; flex-direction: column; align-items: center; gap: var(--space-12); padding: 120px var(--space-24); text-align: center; }
.rd-missing b { font-size: var(--text-heading-20); font-weight: 600; }
.rd-missing p { font-size: var(--text-body-14); color: var(--color-content-neutral-muted); }

/* ---------- 동선 불러오기 ---------- */
function parseMeta(meta) {
  const map = [["당일치기", "당일치기", 1], ["1박2일", "1박 2일", 2], ["2박3일", "2박 3일", 3], ["3박4일", "3박 4일", 4]];
  const flat = meta.replace(/\s/g, "");
  const hit = map.find(([k]) => flat.includes(k)) || map[0];
  return { nights: hit[1], total: hit[2], count: parseInt(meta, 10) || 0, paceLabel: (meta.match(/(여유로운|보통|부지런한) 코스/) || [])[0] || "" };
}
/* 이름·장소로 향 데이터가 있는 지역을 찾는다. 없으면 시·도 → 가까운 지역으로 대체하고 화면에 알린다 */
const KEY_REGION = [["강릉", "gangneung"], ["양양", "gangneung"], ["대관령", "gangneung"], ["경주", "gyeongju"], ["황리단", "gyeongju"], ["안동", "andong"], ["하회", "andong"], ["담양", "damyang"], ["죽녹원", "damyang"], ["제주", "jeju"], ["애월", "jeju"]];
const KEY_SIDO = [["성수", "서울"], ["경복궁", "서울"], ["서울", "서울"], ["광안리", "부산"], ["부산", "부산"], ["전주", "전북"], ["개항장", "인천"], ["인천", "인천"], ["수원", "경기"], ["거제", "경남"]];
function regionFor(text, sido) {
  const hit = KEY_REGION.find(([k]) => text.includes(k));
  if (hit) return { key: hit[1], fallback: null };
  const s = sido || (KEY_SIDO.find(([k]) => text.includes(k)) || [])[1];
  if (s && REGION_WITH_DATA.has(s)) return { key: SIDO_TO_REGION[s], fallback: null };
  return { key: (s && SIDO_TO_REGION[s]) || "gangneung", fallback: s || "이 지역" };
}
/* 카드의 'N개 장소'만큼 매칭 높은 순으로 일차에 나눠 담는다 (시간대는 동선 결과와 같은 규칙) */
function buildDays(total, count) {
  const pool = placesOf(regionKey).slice().sort((a, b) => b.match - a.match);
  const want = Math.min(count || total * 3, pool.length);
  const per = Array.from({ length: total }, (_, d) => Math.floor(want / total) + (d < want % total ? 1 : 0));
  let n = 0;
  return per.map((k, d) => {
    const slots = slotsFor(d + 1, total);
    return Array.from({ length: k }, (_, j) => Object.assign({ slot: slots[Math.min(j, slots.length - 1)], tier: "core" }, pool[n++]));
  });
}
function loadRoute() {
  const sid = params.get("saved");
  if (sid) {
    let list = [];
    try { list = JSON.parse(localStorage.getItem("scentrip_saved_routes") || "[]"); } catch (e) {}
    const r = list.find((x) => x && x.id === sid);
    if (!r || !r.snapshot || !Array.isArray(r.snapshot.days)) return null;
    Object.assign(cond, r.snapshot.cond || {});
    if (REGION_META[r.snapshot.regionKey]) regionKey = r.snapshot.regionKey;
    days = r.snapshot.days;
    return { key: r.id, savedId: r.id, name: r.name, owner: "mine", desc: "", match: null, pop: null, savedAt: r.savedAt, paceLabel: r.pace };
  }
  const name = params.get("name");
  if (!name) return null;
  const m = parseMeta(params.get("meta") || "");
  const reg = regionFor(`${name} ${params.get("place") || ""}`, params.get("sido"));
  regionKey = reg.key;
  fallbackFrom = reg.fallback;
  cond.nights = m.nights;
  days = buildDays(m.total, m.count);
  return { key: name, savedId: null, name, owner: params.get("owner") === "mine" ? "mine" : "others",
           desc: params.get("desc") || "", match: +params.get("match") || null, pop: +params.get("pop") || null, paceLabel: m.paceLabel };
}

function placeHtml(p, i) {
  return `<article class="tl-row tl-item" data-i="${i}">
    <span class="tl-rail"><span class="tl-node is-num">${i + 1}</span></span>
    <div class="tl-cardwrap"><div class="tl-card">
      <div class="tl-body">
        <p class="tl-name"><a href="place-detail.html">${p.name}</a><span class="tl-match">${ACT_ICON.star}${p.match}%</span></p>
        <p class="tl-desc">${p.oneline}</p>
        <div class="tl-tags">${p.scents.map((t) => `<span>${t}</span>`).join("")}</div>
      </div>
      <img class="tl-thumb" src="${p.img}" alt="" loading="lazy">
    </div></div>
  </article>`;
}
function segHtml(a, b) {
  const L = leg([a.lat, a.lng], [b.lat, b.lng]);
  return `<div class="tl-row tl-seg">
    <span class="tl-rail"><span class="tl-node" aria-hidden="true">${ICON[L.main.mode]}</span></span>
    <div class="tl-seg-tx">
      <div class="tl-seg-info">
        <span class="tl-seg-time"><span class="mode">${L.main.label}</span><span class="dot">·</span><span class="min">약 ${minText(L.main.min)}</span></span>
        ${L.alt ? `<span class="alt">또는 ${L.alt.label} 약 ${minText(L.alt.min)}</span>` : ""}
      </div>
      <a class="tl-link" href="https://map.kakao.com/link/to/${encodeURIComponent(b.name)},${b.lat},${b.lng}" target="_blank" rel="noopener">길찾기${ACT_ICON.caretR}</a>
    </div>
  </div>`;
}
function renderDay() {
  const list = shown(at);
  $("daySumTitle").textContent = days.length > 1 ? `${at + 1}일차 동선` : "동선";
  $("timeline").innerHTML = list.length
    ? list.map((p, i) => placeHtml(p, i) + (i < list.length - 1 ? segHtml(p, list[i + 1]) : "")).join("")
    : '<p class="rd-empty">이 날은 일정이 비어 있어요.</p>';
  renderMap();
}

/* ---------- 지도 ---------- */
let mapReady = false;
function initMap() {
  const ok = ScentMap.create($("map"), REGION_META[regionKey].center, 11);
  $("mapFail").hidden = ok;
  mapReady = ok;
}
function renderMap() {
  if (!mapReady) return;
  const list = shown(at);
  ScentMap.clearMarkers();
  list.forEach((p, i) => ScentMap.addMarker(i, [p.lat, p.lng], `<button class="pin" type="button" data-i="${i}" aria-label="${p.name}">${pinShape}<span class="no">${i + 1}</span></button>`));
  const pts = list.map((p) => [p.lat, p.lng]);
  ScentMap.drawRoute(pts);
  ScentMap.fitAll(pts, 13);
}
/* 타임라인 ↔ 지도 양방향 강조 */
function link(i, on) {
  const it = $("timeline").querySelector(`.tl-item[data-i="${i}"]`);
  if (it) it.classList.toggle("is-hot", on);
  if (mapReady) ScentMap.highlight(i, on);
}

/* ---------- 찜 · 공유 · 하단 바 ---------- */
const LIKE_KEY = "scentrip_route_likes";
const isGuest = () => document.documentElement.classList.contains("is-guest");
const toLogin = () => { location.href = "login.html?next=" + encodeURIComponent(location.pathname.split("/").pop() + location.search); };
function readLikes() { try { return JSON.parse(localStorage.getItem(LIKE_KEY) || "[]"); } catch (e) { return []; } }
function renderLike(on) {
  const b = $("likeBtn");
  b.setAttribute("aria-pressed", on ? "true" : "false");
  b.setAttribute("aria-label", on ? "찜 해제" : "찜하기");
  b.querySelector("span").textContent = on ? "찜함" : "찜";
}
const fmtDate = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : `${d.getMonth() + 1}월 ${d.getDate()}일`; };
function renderBar() {
  const mine = route.owner === "mine";
  $("likeBtn").hidden = mine;
  $("barMsg").textContent = mine
    ? (route.savedAt ? `내가 저장한 동선이에요 · ${fmtDate(route.savedAt)} 저장` : "내가 만든 동선이에요")
    : "마음에 드는 동선인가요? 내 일정에 맞게 바꿔서 저장할 수 있어요";
  $("barBtn").textContent = mine ? "편집하기" : "이 동선으로 여행 만들기";
}

let toastT;
function say(msg) {
  $("toastMsg").textContent = msg;
  $("toast").classList.add("is-open");
  clearTimeout(toastT);
  toastT = setTimeout(() => $("toast").classList.remove("is-open"), 2400);
}

function showMissing() {
  $("rdWrap").innerHTML = `<div class="rd-missing" style="grid-column: 1 / -1">
    <b>동선을 찾을 수 없어요</b>
    <p>삭제되었거나 주소가 잘못되었을 수 있어요.</p>
    <a class="save-btn" href="${FROM === "mytrip" ? "my-trip-routes.html" : "route.html"}" style="display:inline-flex;align-items:center;text-decoration:none">동선 목록으로</a>
  </div>`;
  $("rdBar").hidden = true;
}

/* 닉네임 반영 스크립트(아래 공용 스크립트)가 끝난 뒤에 그린다 */
document.addEventListener("DOMContentLoaded", () => {
  route = loadRoute();
  if (!route) { showMissing(); return; }
  renderCrumb(); renderHead(); renderTabs(); initMap(); renderDay(); renderBar();
  renderLike(route.owner !== "mine" && (readLikes().includes(route.key) || FROM === "mytrip"));

  $("dayTabs").addEventListener("click", (e) => {
    const t = e.target.closest(".day-tab"); if (!t) return;
    at = +t.dataset.day; renderTabs(); renderDay();
  });
  $("timeline").addEventListener("mouseover", (e) => { const it = e.target.closest(".tl-item"); if (it) link(+it.dataset.i, true); });
  $("timeline").addEventListener("mouseout", (e) => { const it = e.target.closest(".tl-item"); if (it) link(+it.dataset.i, false); });
  $("map").addEventListener("mouseover", (e) => { const b = e.target.closest(".pin"); if (b) link(+b.dataset.i, true); });
  $("map").addEventListener("mouseout", (e) => { const b = e.target.closest(".pin"); if (b) link(+b.dataset.i, false); });
  $("map").addEventListener("click", (e) => {
    const b = e.target.closest(".pin"); if (!b) return;
    const it = $("timeline").querySelector(`.tl-item[data-i="${b.dataset.i}"]`);
    if (it) it.scrollIntoView({ block: "center", behavior: "smooth" });
  });

  $("likeBtn").addEventListener("click", () => {
    if (isGuest()) { toLogin(); return; }
    const likes = readLikes(), on = !likes.includes(route.key);
    try { localStorage.setItem(LIKE_KEY, JSON.stringify(on ? [...likes, route.key] : likes.filter((k) => k !== route.key))); } catch (e) {}
    renderLike(on);
    say(on ? "내 여행에 찜했어요" : "찜을 해제했어요");
  });
  $("shareBtn").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(location.href); say("링크를 복사했어요"); }
    catch (e) { say("링크를 복사하지 못했어요. 주소창의 링크를 공유해 주세요"); }
  });
  /* 편집하기 = 저장한 동선을 그대로 열어 저장 시 덮어쓰기 · 가져오기 = 복사본으로 열어 저장 시 새 동선 */
  $("barBtn").addEventListener("click", () => {
    if (isGuest()) { toLogin(); return; }
    const mine = route.owner === "mine";
    try {
      localStorage.setItem("scentrip_route_open", JSON.stringify({ mode: mine ? "edit" : "copy", id: mine ? route.savedId : null, name: route.name, snapshot: { regionKey, cond, days } }));
    } catch (e) {}
    location.href = "route-result.html?open=1";
  });
});
</script>
<script>
/* 프로필 팝오버 */
const pill = document.getElementById("profilePill");
const pop = document.getElementById("profilePop");
pill.addEventListener("click", (e) => {
  e.stopPropagation();
  const open = pop.classList.toggle("is-open");
  pill.setAttribute("aria-expanded", open ? "true" : "false");
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".profile")) { pop.classList.remove("is-open"); pill.setAttribute("aria-expanded", "false"); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { pop.classList.remove("is-open"); pill.setAttribute("aria-expanded", "false"); } });
</script>
<script>
document.addEventListener('click',function(e){
  var lo=e.target.closest('[data-logout]'), li=e.target.closest('[data-login]');
  if(lo){e.preventDefault();try{localStorage.setItem('scentrip_auth','out');}catch(x){}location.href='home.html';}
  if(li){e.preventDefault();location.href='login.html?next='+encodeURIComponent((location.pathname.split('/').pop()||'home.html')+location.search+location.hash);}
});
</script>

<script>
/* 가입 때 정한 닉네임을 헤더 프로필에 반영 (signup.html 에서 저장) */
(function () {
  try {
    const nick = localStorage.getItem("scentrip_nickname");
    if (!nick) return;
    document.querySelectorAll(".pill-name, .pop-name").forEach((el) => { el.textContent = nick; });
  } catch (e) {}
})();
</script>
<script>
/* 저장된 프로필 사진을 모든 아바타에 반영 (마이페이지에서 변경) */
(function () {
  try {
    const src = localStorage.getItem("scentrip_avatar");
    if (!src) return;
    document.querySelectorAll(".av").forEach((el) => {
      el.classList.add("has-photo");
      el.style.backgroundImage = 'url("' + src + '")';
    });
  } catch (e) {}
})();
</script>
</body>
