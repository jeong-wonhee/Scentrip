<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scentrip — 리뷰</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

<style>
/* ============================================================
   Scentrip — 여행 장소 상세 · Figma node 95:359 이식
   색/라운드/타이포/스페이싱은 tokens.css var() 사용.
   헤더/푸터는 공용 크롬(home·about과 동일).
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--font-family); letter-spacing: var(--letter-spacing); color: var(--color-content-default); background: var(--color-background); -webkit-font-smoothing: antialiased; word-break: keep-all; overflow-wrap: break-word; }
img { display: block; max-width: 100%; }
button { font-family: inherit; letter-spacing: inherit; cursor: pointer; background: none; border: 0; color: inherit; }
a { color: inherit; }
ul, ol { list-style: none; }
:focus-visible { outline: 3px solid var(--color-border-focus); outline-offset: 2px; border-radius: var(--radius-sm); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition-duration: .01ms !important; } }
.page { display: flex; flex-direction: column; align-items: stretch; width: 100%; min-height: 100vh; }

/* 프로필 칩 + 팝오버 (공용 헤더 컴포넌트) */
.profile { position: relative; }
.type-pill { display: flex; align-items: center; gap: var(--space-8); padding: 4px 4px 4px 12px; background: var(--color-surface-01); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-full); transition: background .18s ease, border-color .18s ease; }
.type-pill:hover, .type-pill[aria-expanded="true"] { background: var(--color-surface-02); border-color: var(--color-border-default); }
.profile-pop { width: 288px; padding: var(--space-8); }
html .guest-only { display: none; }
.is-guest .auth-only { display: none; }
.btn-login { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 var(--space-20); border-radius: var(--radius-full); background: var(--color-primary); color: var(--color-content-on-fill); font-size: var(--text-body-14); font-weight: 600; text-decoration: none; border: 0; transition: background .16s ease; }
.btn-login:hover { background: var(--color-primary-hover); }

/* ============================================================
   Place Detail
   ============================================================ */
.pd { flex: 1 0 auto; width: 100%; }
.pd-hero { width: 100%; height: 480px; background: var(--color-surface-02); overflow: hidden; }
.pd-hero img { width: 100%; height: 100%; object-fit: cover; }
.pd-body { max-width: 1080px; margin: 0 auto; padding: 56px 60px 96px; }
.pd-sec { margin-top: 56px; }
.pd-h2 { font-size: var(--text-heading-24); font-weight: 600; color: var(--color-content-neutral); line-height: 1.3; }

/* 헤더(제목/설명/배지) */
.pd-title-row { display: flex; align-items: flex-start; gap: var(--space-16); }
.pd-title { flex: 1 1 auto; min-width: 0; font-size: var(--text-title-32); font-weight: 700; line-height: 1.25; color: var(--scent-green-950); }
.pd-actions { display: flex; gap: var(--space-8); flex: none; }
.icon-btn-o { width: 44px; height: 44px; border-radius: var(--radius-full); border: 1px solid var(--color-neutral-border); background: var(--color-surface-overlay); display: inline-flex; align-items: center; justify-content: center; color: var(--color-content-neutral-muted); transition: background .14s ease, border-color .14s ease, color .14s ease; }
.icon-btn-o:hover { background: var(--color-surface-01); border-color: var(--color-primary); color: var(--color-primary); }
.icon-btn-o svg { width: 20px; height: 20px; }
.icon-btn-o .heart { width: 20px; height: 20px; color: inherit; }   /* 공용 하트 — 크기·색만 이 버튼에 맞춘다 */
.icon-btn-o.is-saved { color: var(--color-primary); border-color: var(--color-primary); background: var(--color-surface-01); }
.pd-desc { margin-top: var(--space-12); font-size: var(--text-body-16); color: var(--color-content-neutral-muted); }
.pd-badges { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-8); margin-top: var(--space-20); }
.ai-badge { display: inline-flex; align-items: center; gap: var(--space-6); height: 40px; padding: 0 var(--space-16); border-radius: var(--radius-full); background: color-mix(in srgb, var(--color-primary) 10%, var(--color-surface-overlay)); border: 1px solid color-mix(in srgb, var(--color-primary) 24%, transparent); font-size: var(--text-body-14); font-weight: 600; color: var(--color-primary); }
.ai-badge svg { width: 16px; height: 16px; }
.scent-chip { display: inline-flex; align-items: center; height: 40px; padding: 0 var(--space-16); border-radius: var(--radius-full); border: 1px solid var(--color-border-default); background: var(--color-surface-overlay); font-size: var(--text-body-14); font-weight: 600; color: var(--color-content-subtle); }

/* 장소 소개 + 정보 */
.pd-p { margin-top: var(--space-16); font-size: var(--text-body-16); color: var(--color-content-neutral-muted); line-height: 1.8; }
.pd-info { margin-top: var(--space-20); background: var(--color-surface-01); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-xl); padding: var(--space-24); display: flex; flex-direction: column; gap: var(--space-12); }
.pd-info-row { display: flex; align-items: center; gap: var(--space-12); font-size: var(--text-body-16); color: var(--color-content-neutral); }
.pd-info-row svg { width: 20px; height: 20px; color: var(--color-content-neutral-muted); flex: none; }

/* 갤러리 */
.pd-gallery { margin-top: var(--space-20); display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-16); }
.pd-gallery img { width: 100%; height: 240px; object-fit: cover; border-radius: var(--radius-lg); background: var(--color-surface-02); }

/* 지도 */
.pd-map { margin-top: var(--space-20); height: 320px; border-radius: var(--radius-xl); background: color-mix(in srgb, var(--scent-green-100) 55%, var(--color-background)); border: 1px solid var(--color-border-subtle); display: flex; align-items: center; justify-content: center; }
.pd-map-btn { display: flex; flex-direction: column; align-items: center; gap: var(--space-8); color: var(--color-primary); font-size: var(--text-body-14); font-weight: 600; }
.pd-map-btn .pin { width: 44px; height: 44px; border-radius: var(--radius-full); background: var(--color-surface-overlay); box-shadow: var(--elevation-md); display: flex; align-items: center; justify-content: center; }
.pd-map-btn .pin svg { width: 22px; height: 22px; }

/* 리뷰 */
.pd-rv-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-16); }
.pd-rv-head .cnt { font-size: var(--text-heading-24); font-weight: 600; color: var(--color-content-neutral); }
.pd-rv-head .cnt em { font-style: normal; color: var(--color-primary); margin-left: var(--space-6); }
.pd-rv-write { font-size: var(--text-body-14); font-weight: 600; color: var(--color-content-muted); text-decoration: none; }
.pd-rv-write:hover { color: var(--color-primary); }
.pd-rv-list { margin-top: var(--space-20); display: flex; flex-direction: column; gap: var(--space-16); }
.pd-rv { position: relative; padding: var(--space-24); background: var(--color-surface-overlay); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-xl); }
.pd-rv-top { display: flex; align-items: flex-start; gap: var(--space-12); }
.pd-rv-id { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: var(--space-2); }
.pd-rv-name { font-size: var(--text-body-16); font-weight: 600; color: var(--color-content-neutral); }
.pd-rv-meta { font-size: 13px; color: var(--color-content-neutral-muted); }
.pd-rv-stars { display: inline-flex; gap: 2px; margin-top: var(--space-16); }
.pd-rv-stars svg { width: 16px; height: 16px; }
.pd-rv-stars .on { color: var(--color-primary); } .pd-rv-stars .off { color: var(--neutral-300); }
.pd-rv-text { margin-top: var(--space-12); font-size: var(--text-body-14); color: var(--color-content-neutral-muted); line-height: 1.7; }
.pd-rv-photos { margin-top: var(--space-16); display: flex; gap: var(--space-6); }
.pd-rv-photos img { width: 80px; height: 80px; object-fit: cover; border-radius: var(--radius-md); background: var(--color-surface-02); }
.pd-rv-date { margin-top: var(--space-16); font-size: var(--text-caption-12); color: var(--color-content-neutral-subtle); }
.kebab-wrap { position: relative; flex: none; }
.icon-btn { width: 36px; height: 36px; border-radius: var(--radius-full); display: inline-flex; align-items: center; justify-content: center; color: var(--color-content-neutral-muted); transition: background .14s ease, color .14s ease; }
.icon-btn:hover, .icon-btn[aria-expanded="true"] { background: var(--color-surface-01); color: var(--color-content-neutral); }
.icon-btn svg { width: 20px; height: 20px; }
.kebab-menu { width: 148px; padding: var(--space-6); }
.kebab-item { display: flex; align-items: center; gap: var(--space-10); width: 100%; padding: var(--space-10) var(--space-12); border-radius: var(--radius-md); font-size: var(--text-body-14); font-weight: 500; color: var(--color-content-neutral); text-align: left; }
.kebab-item svg { width: 16px; height: 16px; flex: none; color: var(--color-content-neutral-muted); }
.kebab-item:hover { background: var(--color-neutral-subtle); }
.kebab-item.danger { color: var(--color-content-error); } .kebab-item.danger svg { color: var(--color-error); }
.kebab-item.danger:hover { background: var(--color-error-subtle); }
.pd-rv-more { margin-top: var(--space-24); display: flex; justify-content: center; }
.btn-outline { display: inline-flex; align-items: center; justify-content: center; height: 46px; padding: 0 var(--space-24); border-radius: var(--radius-full); background: var(--color-surface-overlay); border: 1px solid var(--color-border-strong); color: var(--color-content-muted); font-size: var(--text-body-14); font-weight: 600; text-decoration: none; transition: background .16s ease, border-color .16s ease, color .16s ease; }
.btn-outline:hover { background: var(--color-surface-01); border-color: var(--color-primary); color: var(--color-primary); }

.pd-divider { height: 1px; background: var(--color-border-subtle); margin: 56px 0 0; border: 0; }

/* 주변 장소 추천 */
.pd-near { margin-top: var(--space-20); display: flex; flex-direction: column; }
.pd-near-row { display: flex; align-items: center; gap: var(--space-16); padding: var(--space-10) 0; text-decoration: none; border-radius: var(--radius-md); }
.pd-near-row:hover .pd-near-name { color: var(--color-primary); }
.pd-near-row img { width: 80px; height: 80px; border-radius: var(--radius-md); object-fit: cover; flex: none; background: var(--color-surface-02); }
.pd-near-tx { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
.pd-near-name { font-size: var(--text-body-16); font-weight: 600; color: var(--color-content-neutral); transition: color .14s ease; }
.pd-near-meta { font-size: var(--text-body-14); color: var(--color-content-neutral-muted); }

/* ---------- 반응형 ---------- */
@media (max-width: 1120px) {
  .pd-hero { height: 360px; }
  .pd-body { padding: 40px 32px 72px; }
  .nav { padding: 0 20px; } .nav-list { gap: var(--space-24); }
  .footer-inner { padding: 48px 32px; }
  .footer-top { flex-direction: column; align-items: flex-start; gap: var(--space-20); }
  .footer-nav { align-items: flex-start; text-align: left; }
}
@media (max-width: 640px) {
  .nav-center { display: none; }
  .pd-hero { height: 240px; }
  .pd-body { padding: 28px 20px 56px; }
  .pd-title { font-size: var(--text-title-28); }
  .pd-gallery { grid-template-columns: 1fr; }
  .pd-gallery img { height: 200px; }
}

/* ============================================================
   장소별 전체 리뷰 (place-reviews.html) — 장소 상세 '전체 리뷰 보기'에서 들어온다.
   리뷰 카드는 장소 상세(.pd-rv)와 같은 모양. 요약(평균·분포) → 정렬·필터 → 목록 → 더 보기.
   데이터: reference/place-reviews.js (장소 상세와 공용)
   ============================================================ */
.prv { flex: 1 0 auto; width: 100%; max-width: 880px; margin: 0 auto; padding: 40px 24px 96px; }
.prv-back { display: inline-flex; align-items: center; gap: var(--space-4); font-size: var(--text-body-14); font-weight: 500; color: var(--color-content-neutral-muted); text-decoration: none; }
.prv-back svg { width: 16px; height: 16px; }
.prv-back:hover { color: var(--color-content-default); }
.prv-head { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: var(--space-16); margin-top: var(--space-16); }
.prv-head h1 { font-size: var(--text-title-32); font-weight: 700; line-height: 1.25; color: var(--color-content-neutral); }
.prv-head h1 em { margin-left: var(--space-8); font-style: normal; color: var(--color-primary); font-variant-numeric: tabular-nums; }
.prv-place { margin-top: var(--space-4); font-size: var(--text-body-16); color: var(--color-content-neutral-muted); }
.prv-write { display: inline-flex; align-items: center; gap: var(--space-6); height: 44px; padding: 0 var(--space-20); border-radius: var(--radius-full); background: var(--color-primary); color: var(--color-content-on-fill); font-size: var(--text-body-14); font-weight: 600; text-decoration: none; transition: background .16s ease; }
.prv-write:hover { background: var(--color-primary-hover); }
.prv-write svg { width: 16px; height: 16px; }

/* 요약 — 평균 + 별점 분포 */
.prv-sum { display: grid; grid-template-columns: 180px minmax(0, 1fr); align-items: center; gap: var(--space-32); margin-top: 28px; padding: var(--space-24) 28px; border: 1px solid var(--color-border-subtle); border-radius: var(--radius-xl); background: var(--color-surface-01); }
.prv-avg { display: flex; flex-direction: column; align-items: center; gap: var(--space-6); text-align: center; }
.prv-avg b { font-size: 44px; font-weight: 700; line-height: 1; color: var(--color-content-neutral); font-variant-numeric: tabular-nums; }
.prv-avg .pd-rv-stars { margin-top: 0; }
.prv-avg small { font-size: 13px; color: var(--color-content-neutral-muted); }
.prv-bars { display: grid; gap: var(--space-8); }
.prv-bar { display: grid; grid-template-columns: 32px minmax(0, 1fr) 32px; align-items: center; gap: var(--space-10); font-size: 13px; color: var(--color-content-neutral-muted); font-variant-numeric: tabular-nums; }
.prv-bar i { display: block; height: 8px; overflow: hidden; border-radius: var(--radius-full); background: var(--color-surface-02); }
.prv-bar i span { display: block; height: 100%; border-radius: inherit; background: var(--color-primary); }
.prv-bar em { font-style: normal; text-align: right; }

/* 정렬 · 필터 */
.prv-tools { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-12); margin-top: var(--space-32); }
.prv-seg { display: flex; gap: var(--space-4); padding: var(--space-4); border-radius: var(--radius-full); background: var(--color-neutral-subtle); }
.prv-seg .seg { height: 36px; padding: 0 var(--space-16); border: 0; border-radius: var(--radius-full); background: none; font-size: var(--text-body-14); font-weight: 600; color: var(--color-content-neutral-subtle); cursor: pointer; transition: background .16s ease, color .16s ease; }
.prv-seg .seg.is-active { background: var(--color-surface-overlay); color: var(--color-content-default); box-shadow: var(--elevation-xs); }
.prv-tools .filter { position: relative; }
.prv-tools .chip-btn { height: 44px; }
.prv-count { margin-left: auto; font-size: var(--text-body-14); font-weight: 600; color: var(--color-content-neutral-muted); font-variant-numeric: tabular-nums; }

/* 목록 — 카드는 장소 상세 .pd-rv 그대로, 긴 글은 세 줄 + 더보기 */
.prv .pd-rv-list { margin-top: var(--space-20); }
.pd-rv-text.is-clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.prv-more-text { margin-top: var(--space-6); padding: 0; border: 0; background: none; font-size: 13px; font-weight: 600; color: var(--color-content-interactive); cursor: pointer; }
.prv-more-text:hover { text-decoration: underline; text-underline-offset: 3px; }
.pd-rv-photos button { padding: 0; border: 0; background: none; border-radius: var(--radius-md); cursor: zoom-in; }
.pd-rv-photos button:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }
.prv-mine { display: inline-flex; align-items: center; height: 20px; margin-left: var(--space-6); padding: 0 var(--space-6); border-radius: var(--radius-sm); background: var(--color-primary-subtle); font-size: var(--text-caption-11); font-weight: 600; color: var(--color-primary); vertical-align: 2px; }
.pd-rv.is-mine { border-color: var(--color-border-default); }
.prv-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-12); margin-top: var(--space-16); }
.prv-foot .pd-rv-date { margin-top: 0; }
.helpful { display: inline-flex; align-items: center; gap: var(--space-6); height: 32px; padding: 0 var(--space-12); border: 1px solid var(--color-neutral-border); border-radius: var(--radius-full); background: var(--color-surface-overlay); font-size: 13px; font-weight: 600; color: var(--color-content-neutral-muted); cursor: pointer; transition: background .14s ease, border-color .14s ease, color .14s ease; }
.helpful svg { width: 14px; height: 14px; }
.helpful:hover { background: var(--color-neutral-subtle); }
.helpful[aria-pressed="true"] { border-color: var(--color-primary); background: var(--color-primary-subtle); color: var(--color-primary); }
.prv-empty { display: flex; flex-direction: column; align-items: center; gap: var(--space-8); margin-top: var(--space-20); padding: var(--space-64) var(--space-20); border: 1px dashed var(--color-border-default); border-radius: var(--radius-xl); text-align: center; }
.prv-empty[hidden], .prv-sum[hidden], .prv-tools[hidden] { display: none; }
.prv-empty b { font-size: var(--text-body-16); font-weight: 600; color: var(--color-content-neutral); }
.prv-empty span { font-size: var(--text-body-14); color: var(--color-content-neutral-muted); }
.pd-rv-more[hidden] { display: none; }

/* 사진 크게 보기 */
.lb { position: fixed; inset: 0; z-index: 900; display: flex; align-items: center; justify-content: center; padding: 48px 24px; background: rgba(18, 28, 24, .86); }
.lb[hidden] { display: none; }
.lb img { max-width: 100%; max-height: 100%; border-radius: var(--radius-lg); box-shadow: var(--elevation-xl); }
.lb-close { position: absolute; top: 20px; right: 20px; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 0; border-radius: var(--radius-full); background: var(--color-surface-overlay); color: var(--color-content-neutral); cursor: pointer; }
.lb-close svg { width: 20px; height: 20px; }

@media (max-width: 640px) {
  .prv { padding: 28px 20px 64px; }
  .prv-head h1 { font-size: var(--text-title-28); }
  .prv-sum { grid-template-columns: minmax(0, 1fr); gap: var(--space-20); padding: var(--space-20); }
  .prv-count { flex: 1 1 100%; margin-left: 0; }
}
</style>
</head>
<body>

<div class="page">
  <!-- ======================= Nav ======================= -->
  <nav class="nav" aria-label="주 메뉴">
    <a class="brand" href="home.html" aria-label="Scentrip 홈">
      <span class="brand-bars" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="brand-name">Scentrip</span>
    </a>
    <div class="nav-center">
      <div class="nav-list">
        <a class="nav-link" href="news.html">소식</a>
        <a class="nav-link is-selected" href="place-recommend.html">탐색</a>
        <a class="nav-link" href="my-trip.html">내 여행</a>
      </div>
    </div>
    <div class="nav-right">
      <a class="btn-login guest-only" href="#" data-login role="button">로그인</a>
      <div class="profile auth-only">
        <button class="type-pill" id="profilePill" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="profilePop">
          <span class="pill-name">이서연</span>
          <span class="av av-28" aria-hidden="true"><span class="av-svg"><svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M230.92,212c-15.23-26.33-38.7-45.21-66.09-54.16a72,72,0,1,0-73.66,0C63.78,166.78,40.31,185.66,25.08,212a8,8,0,1,0,13.85,8c18.84-32.56,52.14-52,89.07-52s70.23,19.44,89.07,52a8,8,0,1,0,13.85-8ZM72,96a56,56,0,1,1,56,56A56.06,56.06,0,0,1,72,96Z"/></svg></span></span>
        </button>

<script src="../reference/place-reviews.js"></script>
<script>
const STAR = 'M234.29,114.85l-45,38.83L203,211.75a16.4,16.4,0,0,1-24.5,17.82L128,198.49,77.47,229.57A16.4,16.4,0,0,1,53,211.75l13.76-58.07-45-38.83A16.46,16.46,0,0,1,31.08,86l59-4.76,22.76-55.08a16.36,16.36,0,0,1,30.27,0l22.75,55.08,59,4.76a16.46,16.46,0,0,1,9.37,28.86Z';
const PERSON = 'M230.92,212c-15.23-26.33-38.7-45.21-66.09-54.16a72,72,0,1,0-73.66,0C63.78,166.78,40.31,185.66,25.08,212a8,8,0,1,0,13.85,8c18.84-32.56,52.14-52,89.07-52s70.23,19.44,89.07,52a8,8,0,1,0,13.85-8ZM72,96a56,56,0,1,1,56,56A56.06,56.06,0,0,1,72,96Z';
const PENCIL = 'M227.32,73.37,182.63,28.69a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31L227.32,96A16,16,0,0,0,227.32,73.37ZM51.31,208l-.06-44.06,88-88,44.11,44.05-88,88Zm137.37-137.37L160,42.06l-25.94,25.94,25.94,25.94Z';
const TRASH = 'M216,48H176V40a24,24,0,0,0-24-24H104A24,24,0,0,0,80,40v8H40a8,8,0,0,0,0,16h8V208a16,16,0,0,0,16,16H192a16,16,0,0,0,16-16V64h8a8,8,0,0,0,0-16ZM112,168a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0Zm48,0a8,8,0,0,1-16,0V104a8,8,0,0,1,16,0ZM160,48H96V40a8,8,0,0,1,8-8h48a8,8,0,0,1,8,8Z';
const KEBAB = 'M140,128a12,12,0,1,1-12-12A12,12,0,0,1,140,128ZM128,72a12,12,0,1,0-12-12A12,12,0,0,0,128,72Zm0,112a12,12,0,1,0,12,12A12,12,0,0,0,128,184Z';
const ico = (d) => `<svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="${d}"/></svg>`;
const stars = (n) => '<span class="pd-rv-stars" role="img" aria-label="5점 만점에 '+n+'점">'+[1,2,3,4,5].map(i=>`<span class="${i<=n?'on':'off'}">${ico(STAR)}</span>`).join('')+'</span>';

/* ============================================================
   장소별 전체 리뷰 — ?place=&loc= (없으면 샘플 장소)
   내 리뷰는 조건에 맞으면 항상 맨 위. 추천순 = 도움돼요 많은 순 → 최신, 최신순 = 작성일 순.
   도움돼요·리뷰 작성은 로그인 필요 (비회원은 로그인으로)
   ============================================================ */
const THUMB = 'M234,80.12A24,24,0,0,0,216,72H160V56a40,40,0,0,0-40-40,8,8,0,0,0-7.16,4.42L75.06,96H32a16,16,0,0,0-16,16v88a16,16,0,0,0,16,16H204a24,24,0,0,0,23.82-21l12-96A24,24,0,0,0,234,80.12ZM32,112H72v88H32ZM223.94,97l-12,96a8,8,0,0,1-7.94,7H88V105.89l36.71-73.43A24,24,0,0,1,144,56V80a8,8,0,0,0,8,8h64a8,8,0,0,1,7.94,9Z';
const CHECK = 'M232.49,80.49l-128,128a12,12,0,0,1-17,0l-56-56a12,12,0,1,1,17-17L96,183,215.51,63.51a12,12,0,0,1,17,17Z';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const qs = new URLSearchParams(location.search);
const PLACE = { name: qs.get("place") || "천관산 억새 언덕", loc: qs.get("loc") || "전남 장흥군 · 자연 명소" };
const IS_GUEST = document.documentElement.classList.contains("is-guest");
const toLogin = () => { location.href = "login.html?next=" + encodeURIComponent("place-reviews.html" + location.search); };
const PAGE = 10;
let list = qs.get("reviews") === "0" ? [] : PLACE_REVIEWS.slice();   // ?reviews=0 → 리뷰 0개 미리보기
const st = { sort: "best", star: 0, photo: false, shown: PAGE, open: new Set(), liked: new Set() };

$("backName").textContent = PLACE.name;
$("placeLine").textContent = `${PLACE.name} · ${PLACE.loc}`;
$("writeBtn").href = "mypage.html?" + new URLSearchParams({ place: PLACE.name, loc: PLACE.loc }) + "#review-write";
document.title = `Scentrip — 리뷰 · ${PLACE.name}`;

let toastT;
function say(msg) { const t = $("toast"); t.querySelector("span").textContent = msg; t.classList.add("is-open"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("is-open"), 2400); }
const helpCount = (r) => r.helpful + (st.liked.has(r.id) ? 1 : 0);

function renderSummary() {
  const n = list.length, sum = list.reduce((s, r) => s + r.rating, 0);
  const avg = n ? sum / n : 0;
  $("total").textContent = n;
  $("avg").innerHTML = `<b>${avg.toFixed(1)}</b>${stars(Math.round(avg))}<small>리뷰 ${n}개</small>`;
  const dist = [5, 4, 3, 2, 1].map((s) => list.filter((r) => r.rating === s).length);
  const max = Math.max(1, ...dist);
  $("bars").innerHTML = [5, 4, 3, 2, 1].map((s, i) =>
    `<div class="prv-bar"><span>${s}점</span><i><span style="width:${Math.round(dist[i] / max * 100)}%"></span></i><em>${dist[i]}</em></div>`).join("");
  $("starMenu").innerHTML = [0, 5, 4, 3, 2, 1].map((s) =>
    `<button class="menu-item" type="button" role="option" aria-selected="${s === st.star}" data-star="${s}"><span>${s ? s + "점" : "별점 전체"}${s ? ` <small>${list.filter((r) => r.rating === s).length}</small>` : ""}</span>${ico(CHECK).replace("<svg ", '<svg class="check" ')}</button>`).join("");
}
function filtered() {
  let out = list.filter((r) => (!st.star || r.rating === st.star) && (!st.photo || r.photos.length));
  out.sort(st.sort === "new"
    ? (a, b) => b.date.localeCompare(a.date)
    : (a, b) => helpCount(b) - helpCount(a) || b.date.localeCompare(a.date));
  return out.filter((r) => r.mine).concat(out.filter((r) => !r.mine));
}
function card(r) {
  const long = r.text.length > 90, open = st.open.has(r.id);
  const kebab = r.mine ? `
      <div class="kebab-wrap">
        <button class="icon-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="내 리뷰 관리">${ico(KEBAB)}</button>
        <div class="popover kebab-menu" role="menu">
          <a class="kebab-item" href="mypage.html#reviews" role="menuitem">${ico(PENCIL)} 리뷰 수정</a>
          <button class="kebab-item danger" type="button" role="menuitem" data-del="${r.id}">${ico(TRASH)} 리뷰 삭제</button>
        </div>
      </div>` : "";
  return `<article class="pd-rv${r.mine ? " is-mine" : ""}" data-id="${r.id}">
    <div class="pd-rv-top">
      <span class="av av-36" aria-hidden="true"><span class="av-svg">${ico(PERSON)}</span></span>
      <div class="pd-rv-id">
        <span class="pd-rv-name">${esc(r.name)}${r.mine ? '<span class="prv-mine">내 리뷰</span>' : ""}</span>
        <span class="pd-rv-meta">${r.type} · ${r.typeName} · ${r.visit} 방문</span>
      </div>${kebab}
    </div>
    ${stars(r.rating)}
    <p class="pd-rv-text${long && !open ? " is-clamp" : ""}">${esc(r.text)}</p>
    ${long ? `<button class="prv-more-text" type="button" data-toggle="${r.id}">${open ? "접기" : "더보기"}</button>` : ""}
    ${r.photos.length ? `<div class="pd-rv-photos">${r.photos.map((p, i) => `<button type="button" data-photo="${p}" aria-label="리뷰 사진 ${i + 1} 크게 보기"><img src="${p}" alt=""></button>`).join("")}</div>` : ""}
    <div class="prv-foot">
      <p class="pd-rv-date">${r.date}</p>
      ${r.mine ? "" : `<button class="helpful" type="button" data-help="${r.id}" aria-pressed="${st.liked.has(r.id)}">${ico(THUMB)}도움돼요 ${helpCount(r)}</button>`}
    </div>
  </article>`;
}
function render() {
  const none = !list.length;   // 리뷰가 하나도 없으면 요약·필터를 숨기고 첫 리뷰 안내
  $("sum").hidden = $("tools").hidden = none;
  $("emptyTitle").textContent = none ? "아직 리뷰가 없어요" : "조건에 맞는 리뷰가 없어요";
  $("emptyDesc").textContent = none ? "다녀온 뒤 오른쪽 위 ‘리뷰 작성하기’로 첫 리뷰를 남겨 주세요." : "별점이나 사진 필터를 바꿔 보세요.";
  const out = filtered();
  $("count").textContent = `${out.length}개`;
  $("rvList").innerHTML = out.slice(0, st.shown).map(card).join("");
  $("empty").hidden = out.length > 0;
  const more = out.length - Math.min(st.shown, out.length);
  $("moreWrap").hidden = more <= 0;
  if (more > 0) $("moreBtn").textContent = `리뷰 더 보기 (${more}개)`;
  const sb = $("starBtn");
  sb.querySelector(".chip-label").textContent = st.star ? `${st.star}점` : "별점 전체";
  sb.classList.toggle("is-active", !!st.star);
  $("photoBtn").classList.toggle("is-active", st.photo);
  $("photoBtn").setAttribute("aria-pressed", st.photo);
}

$("sortSeg").addEventListener("click", (e) => {
  const b = e.target.closest(".seg"); if (!b || b.dataset.sort === st.sort) return;
  st.sort = b.dataset.sort; st.shown = PAGE;
  $("sortSeg").querySelectorAll(".seg").forEach((x) => { const on = x === b; x.classList.toggle("is-active", on); x.setAttribute("aria-selected", on); });
  render();
});
const closeStar = () => { $("starMenu").classList.remove("is-open"); $("starBtn").setAttribute("aria-expanded", "false"); };
$("starBtn").addEventListener("click", (e) => { e.stopPropagation(); const on = !$("starMenu").classList.contains("is-open"); $("starMenu").classList.toggle("is-open", on); $("starBtn").setAttribute("aria-expanded", on); });
$("starMenu").addEventListener("click", (e) => {
  const o = e.target.closest("[data-star]"); if (!o) return;
  st.star = +o.dataset.star; st.shown = PAGE; closeStar(); renderSummary(); render();
});
$("photoBtn").addEventListener("click", () => { st.photo = !st.photo; st.shown = PAGE; render(); });
$("moreBtn").addEventListener("click", () => { st.shown += PAGE; render(); });
$("writeBtn").addEventListener("click", (e) => { if (IS_GUEST) { e.preventDefault(); toLogin(); } });

$("rvList").addEventListener("click", (e) => {
  const t = e.target.closest("[data-toggle]");
  if (t) { const id = t.dataset.toggle; st.open.has(id) ? st.open.delete(id) : st.open.add(id); render(); return; }
  const h = e.target.closest("[data-help]");
  if (h) { if (IS_GUEST) { toLogin(); return; } const id = h.dataset.help; st.liked.has(id) ? st.liked.delete(id) : st.liked.add(id); render(); return; }
  const ph = e.target.closest("[data-photo]");
  if (ph) { $("lbImg").src = ph.dataset.photo; $("lb").hidden = false; $("lbClose").focus(); lbOpener = ph; return; }
  const del = e.target.closest("[data-del]");
  if (del) { list = list.filter((r) => r.id !== del.dataset.del); renderSummary(); render(); say("리뷰를 삭제했어요"); return; }   // TODO(개발): 리뷰 삭제 API
  const btn = e.target.closest(".kebab-wrap .icon-btn");
  document.querySelectorAll(".kebab-menu.is-open").forEach((m) => { if (!btn || m.previousElementSibling !== btn) { m.classList.remove("is-open"); m.previousElementSibling.setAttribute("aria-expanded", "false"); } });
  if (btn) { e.stopPropagation(); const m = btn.nextElementSibling, open = !m.classList.contains("is-open"); m.classList.toggle("is-open", open); btn.setAttribute("aria-expanded", String(open)); }
});
let lbOpener = null;
const closeLb = () => { $("lb").hidden = true; $("lbImg").src = ""; if (lbOpener) lbOpener.focus(); };
$("lb").addEventListener("click", (e) => { if (e.target === $("lb") || e.target.closest("#lbClose")) closeLb(); });
document.addEventListener("click", (e) => { if (!e.target.closest(".filter")) closeStar(); });
document.addEventListener("keydown", (e) => { if (e.key !== "Escape") return; if (!$("lb").hidden) closeLb(); else closeStar(); });

renderSummary(); render();

/* 프로필 팝오버 */
const pill = document.getElementById('profilePill'), pop = document.getElementById('profilePop');
pill.addEventListener('click', (e) => { e.stopPropagation(); const open = pop.classList.toggle('is-open'); pill.setAttribute('aria-expanded', String(open)); });
document.addEventListener('click', (e) => {
  if (!e.target.closest('.profile')) { pop.classList.remove('is-open'); pill.setAttribute('aria-expanded','false'); }
  if (!e.target.closest('.kebab-wrap')) document.querySelectorAll('.kebab-menu.is-open').forEach(m => { m.classList.remove('is-open'); m.previousElementSibling.setAttribute('aria-expanded','false'); });
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { pop.classList.remove('is-open'); pill.setAttribute('aria-expanded','false'); document.querySelectorAll('.kebab-menu.is-open').forEach(m => m.classList.remove('is-open')); } });
</script>
<script>

  var lo=e.target.closest('[data-logout]'), li=e.target.closest('[data-login]');
  if(lo){e.preventDefault();try{localStorage.setItem('scentrip_auth','out');}catch(x){}location.href='home.html';}
  if(li){e.preventDefault();location.href='login.html?next='+encodeURIComponent((location.pathname.split('/').pop()||'home.html')+location.search+location.hash);}

<script>
/* 가입 때 정한 닉네임을 헤더 프로필에 반영 (signup.html 에서 저장) */
(function () {
  try {
    const nick = localStorage.getItem("scentrip_nickname");
    if (!nick) return;
    document.querySelectorAll(".pill-name, .pop-name").forEach((el) => { el.textContent = nick; });
  } catch (e) {}
})();
</script>
<script>
/* 저장된 프로필 사진을 모든 아바타에 반영 (마이페이지에서 변경) */
(function () {
  try {
    const src = localStorage.getItem("scentrip_avatar");
    if (!src) return;
    document.querySelectorAll(".av").forEach((el) => {
      el.classList.add("has-photo");
      el.style.backgroundImage = 'url("' + src + '")';
    });
  } catch (e) {}
})();
</script>
