<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scentrip — 여행 소식</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../reference/tokens.css">
<link rel="stylesheet" href="../reference/components.css">
<style>
/* ============================================================
   Scentrip — 여행 소식 (기획안 「여행 매거진」을 서비스 톤으로 옮김, Figma 프레임 없음)
   색/라운드는 tokens.css var()만 사용. 28·36·44·56·60·200 등
   토큰 스케일에 없는 값만 Figma 수치를 그대로 px로 적음.
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-family);
  letter-spacing: var(--letter-spacing);
  color: var(--color-content-default);
  background: var(--color-background);
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;
  overflow-wrap: break-word;
}
img { display: block; max-width: 100%; }
button { font-family: inherit; letter-spacing: inherit; cursor: pointer; }

.page { display: flex; flex-direction: column; align-items: stretch; width: 100%; min-height: 100vh; }

/* 프로필 칩 + 팝오버 (전 페이지 공용 헤더 컴포넌트) */
.profile { position: relative; }
.type-pill { display: flex; align-items: center; gap: var(--space-8); padding: 4px 4px 4px 12px; background: var(--color-surface-01); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-full); transition: background .18s ease, border-color .18s ease; }
.type-pill:hover, .type-pill[aria-expanded="true"] { background: var(--color-surface-02); border-color: var(--color-border-default); }
.profile-pop { width: 288px; padding: var(--space-8); }
/* 로그인/게스트 토글 (공용) */
html .guest-only { display: none; }
.is-guest .auth-only { display: none; }
.btn-login { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 var(--space-20); border-radius: var(--radius-full); background: var(--color-primary); color: var(--color-content-on-fill); font-size: var(--text-body-14); font-weight: 600; text-decoration: none; border: 0; transition: background .16s ease; }
.btn-login:hover { background: var(--color-primary-hover); }
.is-guest .btn-login { display: inline-flex; }
/* 게스트(비로그인): 개인화(매칭 정렬·취향 필터·AI 매칭 배지) 숨김 + 로그인 유도 배너 */
.is-guest .seg[data-sort="match"] { display: none; }
.is-guest .filter[data-key="taste"] { display: none; }
.is-guest .badge { display: none; }
.guest-banner { display: none; }
.is-guest .guest-banner { display: flex; align-items: center; gap: var(--space-16); padding: var(--space-20) var(--space-24); border-radius: var(--radius-xl); background: var(--scent-green-50); border: 1px solid var(--color-border-default); width: 100%; }
.guest-banner .gb-text { flex: 1 0 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.guest-banner .gb-text b { font-size: var(--text-body-16); font-weight: 600; color: var(--color-content-neutral); }
.guest-banner .gb-text span { font-size: var(--text-body-14); color: var(--color-content-neutral-muted); }


/* ---------- 여행 소식 공용 ---------- */
.nw-cat { display: inline-flex; align-items: center; height: 26px; padding: 0 var(--space-10); border-radius: var(--radius-full); background: var(--color-surface-01); border: 1px solid var(--color-border-subtle); font-size: var(--text-caption-12); font-weight: 600; line-height: 1; color: var(--color-content-muted); white-space: nowrap; }
.nw-dots { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-8); }
.nw-dots > * + *::before { content: ""; display: inline-block; width: 3px; height: 3px; margin-right: var(--space-8); border-radius: var(--radius-full); background: var(--color-content-neutral-subtle); opacity: .5; vertical-align: middle; }
.nw-region { color: var(--neutral-600); }   /* 지역은 날짜·읽는 시간보다 한 단계 진하게 — 시맨틱 토큰에 subtle(500)과 muted(700) 사이 값이 없어 프리미티브 600을 쓴다. 점(·)은 그대로 */
.nw-art { position: absolute; inset: 0; display: block; }
.nw-art svg { display: block; width: 100%; height: 100%; }
.badge { display: inline-flex; align-items: center; gap: var(--space-6); padding: var(--space-4) var(--space-10); border-radius: var(--radius-full); background: var(--color-surface-overlay); border: 1px solid var(--color-border-default); }
.badge svg { width: 14px; height: 14px; color: var(--color-content-subtle); }
.badge span { font-size: var(--text-body-14); font-weight: 600; line-height: 1.5; color: var(--color-content-subtle); white-space: nowrap; }

/* ============================================================
   여행 소식 상세 (news-detail.html?id=) — 기획안 「매거진 상세」를 서비스 톤으로 옮김.
   읽기 폭 760px 한 단. 본문 → 이야기 속 장소(찜) → 동선 만들기 → 출처 → 이전·다음 글
   ============================================================ */
.nd { width: 100%; max-width: 808px; margin: 0 auto; padding: var(--space-32) var(--space-24) var(--space-80); }
.nd-kicker { font-size: var(--text-body-14); font-weight: 500; line-height: 1.5; color: var(--color-content-neutral-subtle); }
.nd-title { margin-top: var(--space-16); font-size: var(--text-display-36); font-weight: 600; line-height: 1.3; color: var(--color-content-neutral); }
.nd-dek { margin-top: var(--space-12); font-size: var(--text-body-18); font-weight: 400; line-height: 1.65; color: var(--color-content-neutral-muted); }
.nd-tools { display: flex; gap: var(--space-8); margin-top: var(--space-20); }
.nd-tool { display: inline-flex; align-items: center; gap: var(--space-6); height: 40px; padding: 0 var(--space-16); border: 1px solid var(--color-neutral-border); border-radius: var(--radius-full); background: var(--color-background); font-size: var(--text-body-14); font-weight: 600; color: var(--color-content-neutral); cursor: pointer; transition: background .14s ease; }
.nd-tool:hover { background: var(--color-neutral-subtle); }
.nd-tool svg { width: 16px; height: 16px; }

.nd-hero, .nd-fig-img { position: relative; display: block; overflow: hidden; border: 1px solid var(--color-border-subtle); background: var(--color-surface-01); }
.nd-hero { margin-top: var(--space-32); aspect-ratio: 16 / 9; border-radius: var(--radius-xl); }
.nd-cap { margin-top: var(--space-8); font-size: var(--text-caption-12); line-height: 1.6; color: var(--color-content-neutral-subtle); }
.nd-cap b { font-weight: 600; color: var(--color-content-neutral-muted); }

.nd-body { margin-top: var(--space-48); }
.nd-body h2 { margin: var(--space-48) 0 var(--space-16); font-size: var(--text-heading-24); font-weight: 600; line-height: 1.35; color: var(--color-content-default); }
.nd-body h2:first-child { margin-top: 0; }
.nd-body > p { margin-bottom: var(--space-20); font-size: var(--text-body-18); font-weight: 400; line-height: 1.8; color: var(--color-content-neutral); }
.nd-fig { margin: var(--space-32) 0 var(--space-40); }
.nd-fig-imgs { display: flex; gap: var(--space-12); }
.nd-fig-img { flex: 1 1 0; min-width: 0; aspect-ratio: 16 / 9; border-radius: var(--radius-lg); }
.nd-fig.is-pair .nd-fig-img { aspect-ratio: 3 / 2; }
.nd-fig figcaption { display: flex; flex-direction: column; gap: 2px; }
.nd-notice { margin-top: var(--space-32); padding: var(--space-16) var(--space-20); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-lg); background: var(--color-surface-01); font-size: var(--text-body-14); line-height: 1.7; color: var(--color-content-muted); }

/* 이야기 속 장소 — 카드 전체가 장소 상세 링크, 하트는 그 위에 */
.nd-sec-title { margin: var(--space-64) 0 var(--space-8); font-size: var(--text-heading-24); font-weight: 600; line-height: 1.3; color: var(--color-content-neutral); }
.nd-sec-sub { margin-bottom: var(--space-20); font-size: var(--text-body-14); line-height: 1.6; color: var(--color-content-neutral-subtle); }
.nd-places { display: flex; flex-direction: column; gap: var(--space-12); }
.nd-place { position: relative; display: flex; align-items: center; gap: var(--space-16); padding: var(--space-12); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-xl); background: var(--color-surface-overlay); transition: border-color .16s ease, box-shadow .16s ease; }
.nd-place:hover { border-color: var(--color-border-default); box-shadow: var(--elevation-sm); }
.nd-pthumb { flex: none; width: 132px; aspect-ratio: 4 / 3; overflow: hidden; border-radius: var(--radius-lg); background: var(--color-surface-01); }
.nd-pthumb img { width: 100%; height: 100%; object-fit: cover; }
.nd-pbody { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: var(--space-4); padding-right: var(--space-40); }
.nd-pregion { font-size: var(--text-caption-12); font-weight: 600; line-height: 1.5; color: var(--color-content-neutral-subtle); }
.nd-pname { font-size: var(--text-body-18); font-weight: 600; line-height: 1.35; color: var(--color-content-neutral); text-decoration: none; }
.nd-pname::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.nd-pname:focus-visible { outline: none; }
.nd-pname:focus-visible::after { outline: 3px solid var(--color-border-focus); outline-offset: 2px; }
.nd-place:hover .nd-pname { color: var(--color-primary); }
.nd-pdesc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: var(--text-body-14); line-height: 1.6; color: var(--color-content-neutral-muted); }
.nd-prow { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-6); margin-top: var(--space-4); }
.nd-tag { display: inline-flex; align-items: center; height: 24px; padding: 0 var(--space-8); border-radius: var(--radius-full); background: var(--color-neutral-subtle); font-size: var(--text-caption-12); font-weight: 500; color: var(--color-content-neutral-muted); }
.nd-pmatch { display: inline-flex; align-items: center; gap: var(--space-4); margin-left: var(--space-4); font-size: var(--text-caption-12); font-weight: 600; color: var(--color-content-subtle); }
.nd-pmatch svg { width: 12px; height: 12px; }
.is-guest .nd-pmatch { display: none; }
.nd-place .heart-btn { position: absolute; top: var(--space-12); right: var(--space-12); z-index: 2; }
.nd-place .heart { width: 24px; height: 24px; }

/* 동선 만들기 */
.nd-cta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-16); margin-top: var(--space-24); padding: var(--space-24); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-xl); background: var(--gradient-mist); }
.nd-cta-txt { flex: 1 1 320px; min-width: 0; }
.nd-cta-txt b { display: block; font-size: var(--text-body-18); font-weight: 600; line-height: 1.4; color: var(--color-content-default); }
.nd-cta-txt span { display: block; margin-top: var(--space-4); font-size: var(--text-body-14); line-height: 1.6; color: var(--color-content-muted); }
.nd-cta-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-8); height: 48px; padding: 0 var(--space-24); border: 0; border-radius: var(--radius-full); background: var(--color-primary); color: var(--color-content-on-fill); font-size: var(--text-body-16); font-weight: 600; white-space: nowrap; box-shadow: var(--elevation-md); cursor: pointer; transition: background .16s ease, transform .16s ease; }
.nd-cta-btn:hover { background: var(--color-primary-hover); transform: translateY(-1px); }
.nd-cta-btn:active { background: var(--color-primary-active); transform: none; }
.nd-cta-btn svg { width: 18px; height: 18px; }
.nd-cta.is-blocked { background: var(--color-warning-subtle); border-color: var(--color-warning-border); }
.nd-cta-btn:disabled { background: var(--color-primary-disabled); box-shadow: none; cursor: not-allowed; transform: none; }

/* 취재·자료 및 이미지 출처 */
.nd-src { margin-top: var(--space-48); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-lg); background: var(--color-surface-overlay); }
.nd-src > summary { list-style: none; display: flex; align-items: center; gap: var(--space-8); padding: var(--space-16) var(--space-20); font-size: var(--text-body-14); font-weight: 600; color: var(--color-content-muted); cursor: pointer; }
.nd-src > summary::-webkit-details-marker { display: none; }
.nd-src > summary svg { width: 16px; height: 16px; margin-left: auto; transition: transform .2s ease; }
.nd-src[open] > summary svg { transform: rotate(180deg); }
.nd-src-body { display: flex; flex-direction: column; gap: var(--space-8); padding: 0 var(--space-20) var(--space-20); }
.nd-src-item { padding: var(--space-12) var(--space-16); border-radius: var(--radius-md); background: var(--color-neutral-bg); }
.nd-src-top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-6); }
.nd-st { display: inline-flex; align-items: center; height: 20px; padding: 0 var(--space-6); border-radius: var(--radius-sm); font-size: var(--text-caption-11); font-weight: 600; }
.nd-st.fact { background: var(--color-surface-02); color: var(--color-content-muted); }
.nd-st.img { background: var(--color-neutral-subtle); color: var(--color-content-neutral-muted); }
.nd-st.ok { background: var(--color-success-subtle); color: var(--color-content-success); }
.nd-st.review { background: var(--color-warning-subtle); color: var(--color-content-warning); }
.nd-src-name { margin-top: var(--space-6); font-size: var(--text-body-14); font-weight: 500; line-height: 1.55; color: var(--color-content-neutral); }
.nd-src-meta { margin-top: 2px; font-size: var(--text-caption-12); line-height: 1.6; color: var(--color-content-neutral-subtle); word-break: break-all; }
.nd-src-meta a { color: var(--color-content-interactive); }
.nd-src-note { margin-top: var(--space-8); font-size: var(--text-caption-12); line-height: 1.7; color: var(--color-content-neutral-subtle); }

/* 이전 · 다음 글 */
.nd-np { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-12); margin-top: var(--space-32); }
.nd-np > * { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-16); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-lg); color: inherit; text-decoration: none; transition: border-color .16s ease, background .16s ease; }
.nd-np a:hover { border-color: var(--color-border-default); background: var(--color-surface-01); }
.nd-np .is-off { opacity: .5; }
.nd-np .next { align-items: flex-end; text-align: right; }
.nd-np .lb { font-size: var(--text-caption-12); font-weight: 600; color: var(--color-content-neutral-subtle); }
.nd-np .tt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: var(--text-body-14); font-weight: 600; line-height: 1.5; color: var(--color-content-neutral); }

.nd-missing { display: flex; flex-direction: column; align-items: center; gap: var(--space-12); padding: 120px var(--space-24); text-align: center; }
.nd-missing b { font-size: var(--text-heading-20); font-weight: 600; }
.nd-missing p { font-size: var(--text-body-14); color: var(--color-content-neutral-muted); }

@media (max-width: 1120px) { .footer-inner { padding-left: 32px; padding-right: 32px; } }
@media (max-width: 720px) {
  .nav { padding: 0 20px; }
  .nd { padding: var(--space-24) var(--space-20) var(--space-64); }
  .nd-title { font-size: var(--text-title-32); }
  .nd-dek { font-size: var(--text-body-16); }
  .nd-body > p { font-size: var(--text-body-16); }
  .nd-fig-imgs { flex-direction: column; }
  .nd-fig-img { flex: none; width: 100%; }   /* 세로로 쌓을 때 flex-basis 0 이 높이를 0 으로 눌러 버리지 않게 */
  .nd-fig.is-pair .nd-fig-img { aspect-ratio: 16 / 9; }
  .nd-pthumb { width: 96px; }
  .nd-cta-btn { width: 100%; }
  .nd-np { grid-template-columns: 1fr; }
  .nd-np .next { align-items: flex-start; text-align: left; }
}
@media (max-width: 560px) {
  .nav-center { display: none; }
  .footer-inner { padding-left: 20px; padding-right: 20px; }
}
</style>
<script>(function(){try{if((localStorage.getItem("scentrip_auth")||"in")==="out")document.documentElement.classList.add("is-guest");}catch(e){}})();</script>

<script>

const check = '<svg class="check" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M232.49,80.49l-128,128a12,12,0,0,1-17,0l-56-56a12,12,0,1,1,17-17L96,183,215.51,63.51a12,12,0,0,1,17,17Z"/></svg>';
const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

const heart = '<svg class="heart" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path class="h-line" d="M178,32c-20.65,0-38.73,8.88-50,23.89C116.73,40.88,98.65,32,78,32A62.07,62.07,0,0,0,16,94c0,70,103.79,126.66,108.21,129a8,8,0,0,0,7.58,0C136.21,220.66,240,164,240,94A62.07,62.07,0,0,0,178,32Zm-50,174c-18.26-11.06-96-64.11-96-112A46.06,46.06,0,0,1,78,48c19.45,0,35.78,10.36,42.6,27a8,8,0,0,0,14.8,0C142.22,58.36,158.55,48,178,48a46.06,46.06,0,0,1,46,46C224,141.87,146.24,194.93,128,206Z"/><path class="h-fill" d="M240,94c0,70-103.79,126.66-108.21,129a8,8,0,0,1-7.58,0C119.79,220.66,16,164,16,94A62.07,62.07,0,0,1,78,32c20.65,0,38.73,8.88,50,23.89C139.27,40.88,157.35,32,178,32A62.07,62.07,0,0,1,240,94Z"/></svg>';
const share = '<svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M216,112v96a16,16,0,0,1-16,16H56a16,16,0,0,1-16-16V112A16,16,0,0,1,56,96H80a8,8,0,0,1,0,16H56v96H200V112H176a8,8,0,0,1,0-16h24A16,16,0,0,1,216,112ZM93.66,69.66,120,43.31V136a8,8,0,0,0,16,0V43.31l26.34,26.35a8,8,0,0,0,11.32-11.32l-40-40a8,8,0,0,0-11.32,0l-40,40A8,8,0,0,0,93.66,69.66Z"/></svg>';

/* ============================================================
   여행 소식 상세 — ?id=<글 id> (reference/news.js)
   - 이야기 속 장소의 하트 = 탐색·홈과 같은 저장 목록(scentrip_saved_cards)에 'place:<id>' 로 저장
   - [동선 만들기] = 글 속 장소를 담아 조건 입력(route-conditions.html?mode=picked)으로 — 찜한 장소로 만들기와 같은 흐름
   - 지역이 섞인 글은 장소를 임의로 빼지 않도록 동선 만들기를 잠근다(기획안 규칙)
   TODO(개발): 글은 id 로 서버 조회, 저장은 계정에 (장소 id 기준)
   ============================================================ */
const $ = (id) => document.getElementById(id);
const m = newsById(new URLSearchParams(location.search).get("id"));
const SAVE_KEY = "scentrip_saved_cards";
const readSaved = () => { try { return new Set(JSON.parse(localStorage.getItem(SAVE_KEY) || "[]")); } catch (e) { return new Set(); } };

let toastT;
function say(msg) { $("toastMsg").textContent = msg; $("toast").classList.add("is-open"); clearTimeout(toastT); toastT = setTimeout(() => $("toast").classList.remove("is-open"), 2400); }

function caption(id) { const im = newsImg(id); return im ? `<p class="nd-cap"><b>${esc(im.caption)}</b> · ${NEWS_IMG_CREDIT}</p>` : ""; }
function figure(ids) {
  return `<figure class="nd-fig${ids.length > 1 ? " is-pair" : ""}">
    <div class="nd-fig-imgs">${ids.map((id) => newsImgHTML(id, "nd-fig-img")).join("")}</div>
    <figcaption>${ids.map(caption).join("")}</figcaption>
  </figure>`;
}
function bodyHTML() {
  const slot = {};
  (m.bodyImages || []).forEach((b) => (slot[b.after] = slot[b.after] || []).push(b.imageIds));
  return m.body.map((s, i) => `<h2>${esc(s.h)}</h2>${s.p.map((t) => `<p>${esc(t)}</p>`).join("")}${(slot[i + 1] || []).map(figure).join("")}`).join("");
}
function placeHTML(p, saved) {
  const on = saved.has("place:" + p.id);
  return `<article class="nd-place${on ? " is-saved" : ""}" data-pid="${p.id}">
    <span class="nd-pthumb"><img src="${p.img}" alt="" loading="lazy"></span>
    <div class="nd-pbody">
      <span class="nd-pregion">${esc(REGION_META[p.region].label)} · ${esc(p.loc.split("·").pop().trim())}</span>
      <a class="nd-pname" href="place-detail.html">${esc(p.name)}</a>
      <p class="nd-pdesc">${esc(p.oneline)}</p>
      <div class="nd-prow">${p.scents.map((s) => `<span class="nd-tag">${esc(s)}</span>`).join("")}<span class="nd-pmatch">${starFour}AI 매칭 ${p.match}%</span></div>
    </div>
    <button class="heart-btn" type="button" aria-pressed="${on}" aria-label="${esc(p.name)} ${on ? "저장 해제" : "저장"}">${heart}</button>
  </article>`;
}
/* 출처 — 사실 확인 자료 + 화면에 쓴 이미지(임시 일러스트 · 장소 사진) */
function sourcesHTML(places) {
  const imgIds = [m.heroImageId, ...(m.bodyImages || []).flatMap((b) => b.imageIds)];
  const items = m.sources.map((s) => `<div class="nd-src-item">
      <div class="nd-src-top"><span class="nd-st fact">사실 확인</span><span class="nd-st ok">확인 완료</span></div>
      <p class="nd-src-name">${esc(s.name)}</p>
      <p class="nd-src-meta">${esc(s.provider)} · 확인일 ${NEWS_CHECKED} · <a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">원문 보기</a></p>
    </div>`)
    .concat(imgIds.map((id) => { const im = newsImg(id); return `<div class="nd-src-item">
      <div class="nd-src-top"><span class="nd-st img">이미지</span><span class="nd-st review">임시 이미지</span></div>
      <p class="nd-src-name">${esc(im.caption)}</p>
      <p class="nd-src-meta">Scentrip 자체 제작 SVG · 이용 제한 없음 · 실사진은 라이선스 확인 후 교체 예정</p>
    </div>`; }))
    .concat([`<div class="nd-src-item">
      <div class="nd-src-top"><span class="nd-st img">이미지</span><span class="nd-st review">검수 필요</span></div>
      <p class="nd-src-name">이야기 속 장소 사진 ${places.length}장 (장소 데이터 공용 이미지)</p>
      <p class="nd-src-meta">탐색·동선 화면과 같은 장소 사진을 씁니다. 서비스 적용 전 이미지별 라이선스 확인이 필요해요.</p>
    </div>`]);
  return `<details class="nd-src">
    <summary>취재·자료 및 이미지 출처 (${items.length}건)${caret}</summary>
    <div class="nd-src-body">${items.join("")}
      <p class="nd-src-note">본문은 여러 공공 자료에서 사실만 확인한 뒤 새로 구성해 작성했습니다. 기사 문장과 보도사진은 사용하지 않았고, 라이선스가 확인되지 않은 글 이미지는 직접 제작한 임시 일러스트로 대신했습니다.</p>
      <p class="nd-src-note">본문의 향 묘사는 장소의 식생과 재료, 음식, 수환경 및 장소 향 태그를 바탕으로 한 감각적 표현입니다. 계절과 날씨에 따라 실제 인상은 달라질 수 있습니다.</p>
    </div>
  </details>`;
}
function npHTML() {
  const i = NEWS.indexOf(m), older = NEWS[i + 1], newer = NEWS[i - 1];
  const box = (n, cls, lb, none) => n
    ? `<a class="${cls}" href="news-detail.html?id=${n.id}"><span class="lb">${lb}</span><span class="tt">${esc(n.title)}</span></a>`
    : `<div class="${cls} is-off"><span class="lb">${lb}</span><span class="tt">${none}</span></div>`;
  return `<nav class="nd-np" aria-label="이전·다음 글">${box(older, "prev", "이전 글", "가장 오래된 글입니다")}${box(newer, "next", "다음 글", "가장 최신 글입니다")}</nav>`;
}

function render() {
  if (!m) {
    $("nd").innerHTML = `<div class="nd-missing"><b>소식을 찾을 수 없어요</b><p>삭제되었거나 주소가 잘못되었을 수 있어요.</p><a class="nd-cta-btn" href="news.html" style="text-decoration:none">여행 소식 목록으로</a></div>`;
    return;
  }
  document.title = `Scentrip — ${m.title}`;
  const places = newsPlaces(m), regions = newsRegions(m), mixed = regions.length > 1;
  const saved = readSaved();
  const cta = places.length === 1 ? "이 장소로 동선 만들기" : `이 이야기 속 ${places.length}곳으로 동선 만들기`;
  $("nd").innerHTML = `
    <header>
      <div class="nd-kicker nw-dots"><span class="nw-cat">${esc(m.category)}</span><span class="nw-region">${regions.map((k) => esc(REGION_META[k].label)).join(" · ")}</span><span>${newsFmtDate(m.date)}</span><span>읽는 데 약 ${newsReadMin(m)}분</span></div>
      <h1 class="nd-title">${esc(m.title)}</h1>
      <p class="nd-dek">${esc(m.dek)}</p>
    </header>
    ${newsImgHTML(m.heroImageId, "nd-hero")}
    ${caption(m.heroImageId)}
    <div class="nd-body">${bodyHTML()}</div>
    <p class="nd-notice">지정 이력·면적·조성 시기는 국가유산청과 각 지자체·공공기관 공식 자료에서 확인했습니다. 운영시간·요금·행사 일정처럼 바뀔 수 있는 정보는 <b>${NEWS_CHECKED} 기준</b>이니, 방문 전 공식 홈페이지에서 다시 확인해 주세요.</p>

    <h2 class="nd-sec-title">이 이야기 속 장소</h2>
    <p class="nd-sec-sub">카드를 누르면 장소 상세로 이동해요. 하트를 누르면 내 여행에 저장돼요.</p>
    <div class="nd-places" id="places">${places.map((p) => placeHTML(p, saved)).join("")}</div>

    <div class="nd-cta${mixed ? " is-blocked" : ""}">
      <div class="nd-cta-txt">
        <b>${mixed ? "지역이 다른 장소가 섞여 있어요" : "글에서 읽은 장소 그대로, 동선으로"}</b>
        <span>${mixed
          ? `이 글에는 ${regions.map((k) => esc(newsRegionName(k))).join(" · ")} 장소가 함께 담겨 있어요.<br>장소를 임의로 빼지 않도록 동선 만들기를 잠갔어요.<br>원하는 장소를 저장한 뒤 내 여행에서 동선을 만들어 주세요.`
          : "이야기 속 장소를 담아 여행 조건만 고르면 AI가 동선을 짜 드려요.<br>결과에서 순서를 바꾸거나 뺄 수 있어요."}</span>
      </div>
      <button class="nd-cta-btn" id="planBtn" type="button"${mixed ? " disabled" : ""}>${starFour}${cta}</button>
    </div>

    ${sourcesHTML(places)}
    ${npHTML()}`;

  $("places").addEventListener("click", (e) => {
    const btn = e.target.closest(".heart-btn"); if (!btn) return;
    const card = btn.closest(".nd-place"), key = "place:" + card.dataset.pid;
    const set = readSaved(), on = !set.has(key);
    on ? set.add(key) : set.delete(key);
    try { localStorage.setItem(SAVE_KEY, JSON.stringify([...set])); } catch (x) {}
    card.classList.toggle("is-saved", on);
    btn.setAttribute("aria-pressed", on);
    btn.setAttribute("aria-label", `${PLACE_DB[card.dataset.pid].name} ${on ? "저장 해제" : "저장"}`);
    say(on ? "내 여행에 저장했어요" : "저장을 해제했어요");
  });
  $("planBtn").addEventListener("click", () => {
    if (mixed) return;
    try {   // route-create.html 과 같은 형식("강릉 안목해변")으로 넘긴다
      localStorage.setItem("scentrip_route_picks", JSON.stringify(places.map((p) => `${newsRegionName(p.region)} ${p.name}`)));
      localStorage.removeItem("scentrip_route_draft");
    } catch (x) {}
    location.href = "route-conditions.html?mode=picked";
  });
}
render();
</script>
<script>
/* 프로필 팝오버 */
const pill = document.getElementById("profilePill");
const pop = document.getElementById("profilePop");
pill.addEventListener("click", (e) => {
  e.stopPropagation();
  const open = pop.classList.toggle("is-open");
  pill.setAttribute("aria-expanded", open ? "true" : "false");
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".profile")) { pop.classList.remove("is-open"); pill.setAttribute("aria-expanded", "false"); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { pop.classList.remove("is-open"); pill.setAttribute("aria-expanded", "false"); } });
</script>

<script>
/* 하트 = 저장 토글 (탐색·홈)
   카드가 다 그려진 뒤 하트를 버튼으로 감싸고, 저장 상태를 localStorage 에서 복원한다.
   내 여행과 반대로 여기서는 기본이 '저장 전'(빈 하트)이다. */
(function () {
  const KEY = "scentrip_saved_cards";
  let saved;
  try { saved = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) { saved = new Set(); }
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify([...saved])); } catch (e) {} };

  document.querySelectorAll(".heart").forEach((svg) => {
    if (svg.closest(".heart-btn")) return;                     // 이미 버튼인 화면은 건드리지 않는다
    const card = svg.closest(".card, .route-card, .featured-card");
    if (!card) return;
    const list = card.parentElement;
    const id = (list.id || list.className.split(" ")[0] || "row") + ":" + [...list.children].indexOf(card);
    card.dataset.save = id;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "heart-btn";
    svg.replaceWith(btn);
    btn.appendChild(svg);
    const on = saved.has(id);
    card.classList.toggle("is-saved", on);
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.setAttribute("aria-label", on ? "저장 해제" : "저장");
  });

  document.addEventListener("click", (e) => {
    const btn = e.target.closest(".heart-btn"); if (!btn) return;
    const card = btn.closest("[data-save]"); if (!card) return;
    e.preventDefault(); e.stopPropagation();                   // 카드 링크로 이동하지 않게
    const on = !card.classList.contains("is-saved");
    card.classList.toggle("is-saved", on);
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.setAttribute("aria-label", on ? "저장 해제" : "저장");
    on ? saved.add(card.dataset.save) : saved.delete(card.dataset.save);
    persist();
  });
})();
</script>
<script>
/* 가입 때 정한 닉네임을 헤더 프로필에 반영 (signup.html 에서 저장) */
(function () {
  try {
    const nick = localStorage.getItem("scentrip_nickname");
    if (!nick) return;
    document.querySelectorAll(".pill-name, .pop-name").forEach((el) => { el.textContent = nick; });
  } catch (e) {}
})();
</script>
<script>
/* 저장된 프로필 사진을 모든 아바타에 반영 (마이페이지에서 변경) */
(function () {
  try {
    const src = localStorage.getItem("scentrip_avatar");
    if (!src) return;
    document.querySelectorAll(".av").forEach((el) => {
      el.classList.add("has-photo");
      el.style.backgroundImage = 'url("' + src + '")';
    });
  } catch (e) {}
})();
</script>
<script src="../reference/lang.js"></script>
</body>
</html>
