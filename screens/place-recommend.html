<title>Scentrip — 탐색 · 장소 추천</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">

<style>
/* ============================================================
   Scentrip — 탐색 · 장소 추천 (Figma node 33:103 그대로 이식)
   색/라운드는 tokens.css var()만 사용. 28·36·44·56·60·200 등
   토큰 스케일에 없는 값만 Figma 수치를 그대로 px로 적음.
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-family);
  letter-spacing: var(--letter-spacing);
  color: var(--color-content-default);
  background: var(--color-background);
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;
  overflow-wrap: break-word;
}
img { display: block; max-width: 100%; }
button { font-family: inherit; letter-spacing: inherit; cursor: pointer; }

.page { display: flex; flex-direction: column; align-items: stretch; width: 100%; min-height: 100vh; }

/* 프로필 칩 + 팝오버 (전 페이지 공용 헤더 컴포넌트) */
.profile { position: relative; }
.type-pill { display: flex; align-items: center; gap: var(--space-8); padding: 4px 4px 4px 12px; background: var(--color-surface-01); border: 1px solid var(--color-border-subtle); border-radius: var(--radius-full); transition: background .18s ease, border-color .18s ease; }
.type-pill:hover, .type-pill[aria-expanded="true"] { background: var(--color-surface-02); border-color: var(--color-border-default); }
.profile-pop { width: 288px; padding: var(--space-8); }
/* 로그인/게스트 토글 (공용) */
html .guest-only { display: none; }
.is-guest .auth-only { display: none; }
.btn-login { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 var(--space-20); border-radius: var(--radius-full); background: var(--color-primary); color: var(--color-content-on-fill); font-size: var(--text-body-14); font-weight: 600; text-decoration: none; border: 0; transition: background .16s ease; }
.btn-login:hover { background: var(--color-primary-hover); }
.is-guest .btn-login { display: inline-flex; }
/* 게스트(비로그인): 개인화(매칭 정렬·취향 필터·AI 매칭 배지) 숨김 + 로그인 유도 배너 */
.is-guest .seg[data-sort="match"] { display: none; }
.is-guest .filter[data-key="taste"] { display: none; }
.is-guest .badge { display: none; }
.guest-banner { display: none; }
.is-guest .guest-banner { display: flex; align-items: center; gap: var(--space-16); padding: var(--space-20) var(--space-24); border-radius: var(--radius-xl); background: var(--scent-green-50); border: 1px solid var(--color-border-default); width: 100%; }
.guest-banner .gb-text { flex: 1 0 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.guest-banner .gb-text b { font-size: var(--text-body-16); font-weight: 600; color: var(--color-content-neutral); }
.guest-banner .gb-text span { font-size: var(--text-body-14); color: var(--color-content-neutral-muted); }

/* ---------- 탭 (여행 장소 / 여행 동선) ---------- */
.tabs { display: flex; gap: 28px; align-items: flex-start; padding: 36px 60px; width: 100%; font-size: var(--text-title-32); font-weight: 600; line-height: 1.25; white-space: nowrap; }
.tabs .tab { color: var(--color-content-neutral-disabled); text-decoration: none; }
.tabs .tab.is-active { color: var(--color-primary); }

/* ---------- 콘텐츠 영역 ---------- */
.content { display: flex; flex-direction: column; gap: 28px; align-items: center; padding: 20px 60px 36px; width: 100%; background: var(--color-background); }

/* 필터 바 */
.filterbar { display: flex; gap: var(--space-24); align-items: center; width: 100%; }
.filter-left { flex: 1 0 0; display: flex; gap: var(--space-24); align-items: center; min-width: 0; }
.segmented { position: relative; display: flex; gap: var(--space-4); padding: var(--space-4); background: var(--color-neutral-subtle); border-radius: 999px; }
.seg { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; height: 36px; padding: 0 var(--space-16); border-radius: 999px; border: 0; background: none; font-size: var(--text-body-16); font-weight: 600; line-height: 1.5; color: var(--color-content-neutral-subtle); white-space: nowrap; transition: color .2s ease; }
.seg.is-active { color: var(--color-content-default); }
.seg-thumb { position: absolute; top: var(--space-4); bottom: var(--space-4); left: 0; width: 0; border-radius: 999px; background: var(--color-surface-overlay); box-shadow: var(--elevation-xs); z-index: 0; pointer-events: none; transition: transform .28s cubic-bezier(.22,.61,.36,1), width .28s cubic-bezier(.22,.61,.36,1); }
.divider-v { width: 1px; height: 20px; background: var(--color-neutral-border); flex: none; }
.filter-chips { display: flex; gap: var(--space-8); align-items: center; }
.count { font-size: var(--text-body-14); font-weight: 600; line-height: 1.5; color: var(--color-content-neutral-muted); white-space: nowrap; flex: none; }
.seg { cursor: pointer; }

/* 필터 드롭다운 (라운드 그림자 셀렉트 팝오버) */
.filter { position: relative; }

/* ---------- 지역 필터 — 시·도 레일 + 시·군·구 리스트 ----------
   패널 자체는 무채색으로 두고 색은 '선택'에만 쓴다 (레일 선택 pill · 선택된 행 + 체크).
   행 구분은 박스가 아니라 헤어라인, 선택 표시는 체크박스가 아니라
   기존 필터 드롭다운(.filter-opt)과 같은 오른쪽 체크 아이콘. */
.region-pop { width: 520px; max-width: calc(100vw - 40px); padding: 0; border-radius: var(--radius-xl); box-shadow: var(--elevation-lg); overflow: hidden; display: flex; flex-direction: column; }
.rg-search { padding: var(--space-16) var(--space-16) var(--space-12); }
.rg-field { position: relative; display: flex; align-items: center; }
.rg-field > svg { position: absolute; right: var(--space-16); width: 18px; height: 18px; color: var(--color-content-neutral-subtle); pointer-events: none; transition: opacity .12s ease; }
.rg-clear { position: absolute; right: var(--space-12); display: none; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: var(--radius-md); background: none; color: var(--color-content-neutral-subtle); transition: background .14s ease, color .14s ease; }
.rg-clear svg { width: 18px; height: 18px; }
.rg-clear:hover { background: var(--color-neutral-border); color: var(--color-content-neutral); }
.rg-clear.is-on { display: inline-flex; }
.rg-field.is-filled > svg { opacity: 0; }
.rg-input { width: 100%; height: 46px; padding: 0 42px 0 var(--space-16); border: 1px solid transparent; border-radius: var(--radius-lg); background: var(--color-neutral-bg); font-family: inherit; letter-spacing: inherit; font-size: var(--text-body-14); font-weight: 500; color: var(--color-content-neutral); outline: none; transition: border-color .14s ease; }
.rg-input::placeholder { color: var(--color-content-neutral-subtle); font-weight: 400; }
.rg-input:focus { border-color: var(--color-neutral-border); }
.rg-input::-webkit-search-cancel-button { -webkit-appearance: none; }

.rg-body { display: flex; align-items: stretch; height: 316px; }
.rg-body.is-searching .rg-rail { display: none; }   /* 검색 결과는 시·도와 무관하므로 레일을 접는다 */
.rg-rail { position: relative; width: 152px; flex: none; overflow-y: auto; padding: var(--space-8) var(--space-16); background: var(--color-neutral-bg); display: flex; flex-direction: column; gap: var(--space-2); }
.rg-sido { display: flex; align-items: center; gap: var(--space-8); width: 100%; height: 40px; flex: none; padding: 0 var(--space-16); border: 0; background: none; border-radius: var(--radius-md); font-size: var(--text-body-14); font-weight: 600; line-height: 1.5; color: var(--color-content-neutral-muted); text-align: left; transition: background .14s ease, color .14s ease; }
.rg-sido:hover { color: var(--color-content-neutral); }
.rg-sido.is-active { background: var(--color-surface-overlay); color: var(--color-primary); box-shadow: var(--elevation-xs); }   /* 정렬 세그먼트의 흰 pill과 같은 강조 */
.rg-sido.is-off { color: var(--color-content-neutral-disabled); cursor: default; }
.rg-cnt { margin-left: auto; font-size: var(--text-caption-12); font-weight: 600; line-height: 1.5; color: var(--color-primary); font-variant-numeric: tabular-nums; flex: none; }

.rg-list { flex: 1 0 0; min-width: 0; overflow-y: auto; padding: 0 var(--space-16) var(--space-12); display: flex; flex-direction: column; }
.rg-row { display: flex; align-items: center; gap: var(--space-8); width: 100%; min-height: 48px; flex: none; padding: var(--space-12) 0; border: 0; border-bottom: 1px solid var(--color-border-subtle); background: none; text-align: left; }
.rg-row:last-child { border-bottom: 0; }

.rg-row.is-off { color: var(--color-content-neutral-disabled); cursor: default; }
.rg-label { flex: 1 0 0; min-width: 0; display: flex; align-items: baseline; gap: var(--space-4); font-size: var(--text-body-14); font-weight: 400; line-height: 1.5; color: var(--color-content-neutral); }
.rg-name { min-width: 0; }
.rg-label em { font-style: normal; margin-left: var(--space-4); font-size: var(--text-caption-12); font-weight: 400; color: var(--color-content-neutral-subtle); }
.rg-row.is-off .rg-label { color: var(--color-content-neutral-disabled); }
.rg-all { position: sticky; top: 0; z-index: 1; background: var(--color-surface-overlay); border-bottom-color: var(--color-neutral-border); }
.rg-all .rg-label { font-weight: 500; }
.rg-hit { background: none; color: var(--color-primary); font-weight: 600; }
.rg-hint { padding: var(--space-12) 0 var(--space-4); font-size: var(--text-caption-12); font-weight: 500; line-height: 1.5; color: var(--color-content-neutral-subtle); }
.rg-empty { margin: auto 0; display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-6); padding: var(--space-32) var(--space-16); }
.rg-empty b { font-size: var(--text-body-14); font-weight: 600; color: var(--color-content-neutral); }
.rg-empty span { font-size: var(--text-body-14); font-weight: 400; color: var(--color-content-neutral-muted); }

.rg-foot { display: flex; align-items: center; gap: var(--space-8); padding: var(--space-12) var(--space-16); border-top: 1px solid var(--color-border-subtle); background: var(--color-surface-overlay); }
.rg-reset, .rg-apply { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-6); height: 44px; border-radius: var(--radius-lg); font-size: var(--text-body-14); font-weight: 600; line-height: 1.5; border: 0; white-space: nowrap; transition: background .16s ease, color .16s ease; }
.rg-reset { flex: none; padding: 0 var(--space-16); background: none; color: var(--color-content-neutral-muted); }
.rg-reset svg { width: 16px; height: 16px; }
.rg-reset:hover { background: var(--color-neutral-subtle); color: var(--color-content-neutral); }
.rg-reset:disabled { color: var(--color-content-neutral-disabled); cursor: not-allowed; pointer-events: none; }
.rg-apply { flex: 1 0 0; padding: 0 var(--space-24); background: var(--color-primary); color: var(--color-content-on-fill); }
.rg-apply:hover { background: var(--color-primary-hover); }
.rg-apply:active { background: var(--color-primary-active); }

@media (max-width: 640px) {
  .rg-rail { width: 112px; }
  .rg-body { height: 280px; }
}

/* 취향 타입 옵션 — 액센트 컬러 아바타(추후 캐릭터 일러스트 자리) + 타이틀/서브텍스트 */
.filter[data-key="taste"] .filter-pop {
  width: 480px;
  max-height: 420px;
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: var(--space-4);
  align-content: start;
}
.filter[data-key="taste"] .filter-opt.opt-taste { width: 100%; }
.filter-opt.opt-taste { padding: var(--space-10) var(--space-12); white-space: normal; }
.opt-left { display: flex; align-items: center; gap: var(--space-10); min-width: 0; }
.opt-avatar { width: 32px; height: 32px; border-radius: var(--radius-full); flex: none; }
.opt-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.opt-title { font-size: var(--text-body-14); font-weight: 500; color: var(--color-content-default); white-space: nowrap; }
.opt-sub { font-size: var(--text-caption-11); color: var(--color-content-neutral-muted); white-space: nowrap; }
.filter-opt.opt-taste.is-selected .opt-title { color: var(--color-content-subtle); font-weight: 600; }

/* 카드 그리드 */
.grid { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: var(--space-24); row-gap: var(--space-48); transition: opacity .18s ease; }
.card { display: flex; flex-direction: column; gap: var(--space-24); }
.card-photo {
  position: relative; height: 200px; overflow: hidden;
  border: 1px solid var(--color-border-subtle); border-radius: var(--radius-xl);
  padding: var(--space-12); display: flex; flex-direction: column;
}
.card-photo .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.card-top { position: relative; display: flex; gap: var(--space-8); align-items: flex-start; justify-content: flex-end; width: 100%; }
.badge-wrap { flex: 1 0 0; display: flex; min-width: 0; }
.badge { display: inline-flex; align-items: center; gap: var(--space-6); padding: var(--space-4) var(--space-10); border-radius: var(--radius-full); background: var(--color-surface-overlay); border: 1px solid var(--color-border-default); }
.badge svg { width: 14px; height: 14px; color: var(--color-content-subtle); }
.badge span { font-size: var(--text-body-14); font-weight: 600; line-height: 1.5; color: var(--color-content-subtle); white-space: nowrap; }
.card-body { display: flex; flex-direction: column; gap: var(--space-8); }
.card-name { font-size: var(--text-heading-20); font-weight: 600; line-height: 1.25; color: var(--color-content-neutral); }
.card-desc { font-size: var(--text-body-16); font-weight: 400; line-height: 1.5; color: var(--color-content-neutral-muted); }
.card-meta { display: flex; gap: var(--space-8); font-size: var(--text-body-16); font-weight: 500; line-height: 1.5; color: var(--color-content-neutral-subtle); }

/* ---------- 반응형 (Figma는 데스크톱 기준 · 좁은 폭 우아하게 축소) ---------- */
@media (max-width: 1120px) {
  .tabs, .content, .footer-inner { padding-left: 32px; padding-right: 32px; }
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  .nav { padding: 0 20px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .filterbar { flex-wrap: wrap; }
  .filter-left { flex-wrap: wrap; }
}
@media (max-width: 560px) {
  .nav-center { display: none; }
  .grid { grid-template-columns: 1fr; }
  .tabs { font-size: var(--text-title-28); }
}
</style>
<script>(function(){try{if((localStorage.getItem("scentrip_auth")||"in")==="out")document.documentElement.classList.add("is-guest");}catch(e){}})();</script>

  </nav>

const rgIconX = '<svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm37.66,130.34a8,8,0,0,1-11.32,11.32L128,139.31l-26.34,26.35a8,8,0,0,1-11.32-11.32L116.69,128,90.34,101.66a8,8,0,0,1,11.32-11.32L128,116.69l26.34-26.35a8,8,0,0,1,11.32,11.32L139.31,128Z"/></svg>';

const rgFilter = chipsWrap.querySelector('.filter[data-key="region"]');
const rgPop = rgFilter.querySelector(".filter-pop");
rgPop.classList.add("region-pop");
rgPop.removeAttribute("role");
rgPop.innerHTML = `
  <div class="rg-search">
    <div class="rg-field">
      ${rgIconSearch}
      <input class="rg-input" id="rgInput" type="search" placeholder="지역명 검색 (예: 경주, 강원)" aria-label="지역명 검색" autocomplete="off">
      <button class="rg-clear" type="button" aria-label="검색어 지우기">${rgIconX}</button>
    </div>
  </div>
  <div class="rg-body">
    <div class="rg-rail" role="tablist" aria-label="시·도"></div>
    <div class="rg-list" role="group" aria-label="시·군·구"></div>
  </div>
  <div class="rg-foot">
    <button class="rg-reset" type="button">${rgIconReset}초기화</button>
    <button class="rg-apply" type="button"></button>
  </div>`;

const rgInput = rgPop.querySelector(".rg-input");
const rgBody = rgPop.querySelector(".rg-body");
const rgClear = rgPop.querySelector(".rg-clear");
const rgRail = rgPop.querySelector(".rg-rail");
const rgListEl = rgPop.querySelector(".rg-list");
const rgResetBtn = rgPop.querySelector(".rg-reset");
const rgApplyBtn = rgPop.querySelector(".rg-apply");

let rgDraft = [];
let rgQuery = "";
let rgActive = (REGIONS.find((r) => r.count > 0) || REGIONS[0]).name;

function rgIsOn(token) {
  const [s, u] = token.split(">");
  return rgDraft.includes(token) || (!!u && rgDraft.includes(s));
}
function rgToggle(token) {
  const [sido, unit] = token.split(">");
  const r = rgFind(sido); if (!r) return;
  const set = new Set(rgDraft);
  if (set.has(sido)) { set.delete(sido); rgLive(r).forEach((t) => set.add(t)); }   // 도 전체 → 개별로 펼치기
  if (!unit) {
    const all = rgLive(r);
    const on = all.every((t) => set.has(t));
    all.forEach((t) => (on ? set.delete(t) : set.add(t)));
  } else {
    set.has(token) ? set.delete(token) : set.add(token);
  }
  REGIONS.forEach((rr) => {                                                        // 전부 선택되면 도 토큰으로 접기
    const all = rgLive(rr);
    if (all.length && all.every((t) => set.has(t))) { all.forEach((t) => set.delete(t)); set.add(rr.name); }
  });
  rgDraft = REGIONS.flatMap((rr) => [rr.name, ...rgLive(rr)]).filter((t) => set.has(t));
}

function rgRow(token, label, sub, count, cls) {
  const off = count === 0;
  const on = !off && rgIsOn(token);
  return `<button class="rg-row${cls ? " " + cls : ""}${on ? " is-on" : ""}${off ? " is-off" : ""}" type="button" role="checkbox" aria-checked="${on}" data-token="${token}"${off ? " disabled" : ""}>
    <span class="ck" aria-hidden="true">${rgIconCheck}</span>
    <span class="rg-label"><span class="rg-name">${label}</span>${sub ? `<em>${sub}</em>` : ""}</span>
  </button>`;
}
function rgPickedCount(r) {   // 이 시·도에서 몇 곳을 골랐는지
  return rgDraft.includes(r.name) ? rgLive(r).length : rgDraft.filter((t) => t.startsWith(r.name + ">")).length;
}
function rgRenderRail() {
  rgRail.innerHTML = REGIONS.map((r) => {
    const off = r.count === 0;
    const picked = rgDraft.some((t) => t.split(">")[0] === r.name);
    const isAct = !rgQuery && r.name === rgActive;   // 검색 중에는 레일에 현재 시·도가 없다
    const cls = [isAct ? "is-active" : "", off ? "is-off" : "", picked ? "is-picked" : ""].filter(Boolean).join(" ");
    return `<button class="rg-sido${cls ? " " + cls : ""}" type="button" role="tab" aria-selected="${isAct}" data-sido="${r.name}"${off ? " disabled" : ""}>
      <span>${r.name}</span>${picked ? `<b class="rg-cnt">${rgPickedCount(r)}</b>` : ""}
    </button>`;
  }).join("");
  const act = rgRail.querySelector(".rg-sido.is-active");   // 선택된 시·도는 레일 안에서 항상 보이게
  if (act) {
    const top = act.offsetTop, bottom = top + act.offsetHeight;
    if (top < rgRail.scrollTop) rgRail.scrollTop = top - 8;
    else if (bottom > rgRail.scrollTop + rgRail.clientHeight) rgRail.scrollTop = bottom - rgRail.clientHeight + 8;
  }
}
function rgMark(text, q) {                                  // 검색어와 겹치는 글자만 강조
  const i = text.indexOf(q);
  return i < 0 ? text : `${text.slice(0, i)}<mark class="rg-hit">${text.slice(i, i + q.length)}</mark>${text.slice(i + q.length)}`;
}
function rgRenderList(keepScroll) {
  const top = rgListEl.scrollTop;
  rgBody.classList.toggle("is-searching", !!rgQuery);       // 검색 중에는 시·도 레일이 필요 없다
  rgClear.classList.toggle("is-on", !!rgQuery);
  rgClear.parentElement.classList.toggle("is-filled", !!rgQuery);   // 돋보기 ↔ 지우기 교체
  if (rgQuery) {
    const q = rgQuery;
    const hits = [];
    REGIONS.forEach((r) => {
      const hitSido = r.name.includes(q);
      if (hitSido && r.count > 0) hits.push({ token: r.name, label: r.name + " 전체", sub: "시·도 전체", count: r.count });
      r.units.forEach((u) => { if (hitSido || u.name.includes(q)) hits.push({ token: r.name + ">" + u.name, label: u.name, sub: r.name, count: u.count }); });
    });
    hits.sort((a, b) => (b.count > 0) - (a.count > 0));   // 데이터 있는 지역 먼저, 그 안에서는 지리 순서 유지
    rgListEl.innerHTML = hits.length
      ? `<p class="rg-hint">검색 결과 ${hits.length}곳</p>` + hits.map((h) => rgRow(h.token, rgMark(h.label, q), h.sub, h.count)).join("")
      : `<div class="rg-empty"><b>‘${q}’에 맞는 지역이 없어요</b><span>시·도나 시·군·구 이름으로 검색해 보세요</span></div>`;
  } else {
    const r = rgFind(rgActive);
    const all = rgLive(r);
    const on = all.length > 0 && all.every((t) => rgDraft.includes(t) || rgDraft.includes(r.name));
    const some = !on && all.some((t) => rgIsOn(t));
    rgListEl.innerHTML = rgRow(r.name, r.name + " 전체", "", r.count, "rg-all" + (some ? " is-part" : ""))
      + r.units.map((u) => rgRow(r.name + ">" + u.name, u.name, "", u.count)).join("");
  }
  rgListEl.scrollTop = keepScroll ? top : 0;
}
const RG_CAP = 1000;   // 이 이상은 정확한 수를 세는 의미가 없어 'N개 이상'으로 끊는다
function rgCountText(n) { return n >= RG_CAP ? `총 ${RG_CAP.toLocaleString()}개 이상 ${RG_NOUN}` : `총 ${n.toLocaleString()}개 ${RG_NOUN}`; }
function rgRenderFoot() {
  const n = rgDraft.length ? rgSumOf(rgDraft) : rgTotal();
  rgApplyBtn.textContent = n >= RG_CAP
    ? `${RG_CTA_NOUN} ${RG_CAP.toLocaleString()}개 이상 보기`
    : `${RG_CTA_NOUN} ${n.toLocaleString()}개 보기`;
  rgResetBtn.disabled = !rgDraft.length;
}
function rgRender(keepScroll) { rgRenderRail(); rgRenderList(keepScroll); rgRenderFoot(); }
function rgSyncChip() { updateChip("region"); rgFilter.querySelector(".chip-label").textContent = rgSummary(); }

/* 패널이 560px라 칩 위치에 따라 오른쪽으로 넘칠 수 있어 뷰포트 안으로 당겨준다 */
function rgPlace() {
  rgPop.style.left = "0px";
  const r = rgPop.getBoundingClientRect();
  const over = r.right - (window.innerWidth - 16);
  if (over > 0) rgPop.style.left = -Math.min(over, Math.max(0, r.left - 16)) + "px";
}
window.addEventListener("resize", rgPlace);

/* 칩을 열 때마다 현재 적용값을 드래프트로 복사 (chipsWrap 위임 핸들러보다 먼저 실행됨) */
rgFilter.querySelector(".chip-btn").addEventListener("click", () => {
  rgDraft = [...applied.region];
  rgQuery = ""; rgInput.value = "";
  if (rgDraft.length) rgActive = rgDraft[0].split(">")[0];
  rgRender();
  requestAnimationFrame(rgPlace);
});
/* 레일·리스트는 클릭 즉시 다시 그려져 타깃이 DOM에서 떨어져 나간다.
   그대로 두면 바깥 클릭 판정(closest(".filter"))이 실패해 팝오버가 닫히므로 여기서 전파를 끊는다. */
rgRail.addEventListener("click", (e) => {
  e.stopPropagation();
  const b = e.target.closest(".rg-sido"); if (!b || b.disabled) return;
  rgActive = b.dataset.sido; rgQuery = ""; rgInput.value = "";
  rgRenderRail(); rgRenderList();
});
rgListEl.addEventListener("click", (e) => {
  e.stopPropagation();
  const b = e.target.closest(".rg-row"); if (!b || b.disabled) return;
  rgToggle(b.dataset.token);
  if (rgQuery) rgActive = b.dataset.token.split(">")[0];   // 검색을 지우면 방금 고른 시·도로 돌아가게
  rgRender(true);
});
rgInput.addEventListener("input", () => { rgQuery = rgInput.value.trim(); rgRenderList(); rgRenderRail(); });
rgInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); rgApplyBtn.click(); } });
rgClear.addEventListener("click", (e) => { e.stopPropagation(); rgInput.value = ""; rgQuery = ""; rgRenderList(); rgRenderRail(); rgInput.focus(); });
rgResetBtn.addEventListener("click", (e) => { e.stopPropagation(); rgDraft = []; rgRender(); });
rgApplyBtn.addEventListener("click", () => {
  applied.region = [...rgDraft];
  rgSyncChip(); closePops(); applyView();
});
rgRender();
document.getElementById("count").textContent = rgCountText(rgTotal());

const countEl = document.getElementById("count");
function closePops() {
  chipsWrap.querySelectorAll(".filter-pop.is-open").forEach((p) => p.classList.remove("is-open"));
  chipsWrap.querySelectorAll('.chip-btn[aria-expanded="true"]').forEach((b) => b.setAttribute("aria-expanded", "false"));
}
function hashCount(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return Math.max(3, Math.round(rgTotal() * (15 + (h % 45)) / 100)); }

let sortKey = "match";
function applyView() {
  grid.style.opacity = "0";
  setTimeout(() => {
    const asc = sortKey === "dist";
    const cards = [...grid.children].sort((a, b) => asc ? a.dataset[sortKey] - b.dataset[sortKey] : b.dataset[sortKey] - a.dataset[sortKey]);
    // 취향타입은 개인화 기준값이라 개수에 영향 X, 나머지 필터가 결과를 좁힌다
    const active = FILTERS.filter((f) => f.key !== "taste" && applied[f.key].length).map((f) => applied[f.key].join(",")).join("|");
    const others = FILTERS.filter((f) => f.key !== "taste" && f.key !== "region" && applied[f.key].length).length;
    let n = applied.region.length ? rgSum() : (active ? hashCount(active) : rgTotal());
    if (applied.region.length && others) n = Math.max(2, Math.round(n * 0.55));
    const shown = Math.min(n, cards.length);
    cards.forEach((c, i) => { c.style.display = i < shown ? "" : "none"; grid.appendChild(c); });
    countEl.textContent = rgCountText(n);
    grid.style.opacity = "1";
  }, 180);
}

/* 정렬 세그먼트 — 선택된 흰색 pill이 슬라이드로 이동 */
const sortSeg = document.getElementById("sortSeg");
const segThumb = document.createElement("span");
segThumb.className = "seg-thumb";
segThumb.setAttribute("aria-hidden", "true");
sortSeg.prepend(segThumb);
function placeThumb(seg, instant) {
  if (instant) segThumb.style.transition = "none";
  segThumb.style.width = seg.offsetWidth + "px";
  segThumb.style.transform = "translateX(" + seg.offsetLeft + "px)";
  if (instant) { void segThumb.offsetWidth; segThumb.style.transition = ""; }
}
function repositionThumb() { const a = sortSeg.querySelector(".seg.is-active"); if (a) placeThumb(a, true); }
requestAnimationFrame(repositionThumb);
window.addEventListener("load", repositionThumb);
window.addEventListener("resize", repositionThumb);
sortSeg.addEventListener("click", (e) => {
  const btn = e.target.closest(".seg"); if (!btn) return;
  sortSeg.querySelectorAll(".seg").forEach((s) => s.classList.remove("is-active"));
  btn.classList.add("is-active");
  placeThumb(btn, false);
  sortKey = btn.dataset.sort;
  applyView();
});

/* 게스트(비로그인): 매칭 정렬 대신 인기순 기본, 취향 프리셋 해제 */
if (document.documentElement.classList.contains("is-guest")) {
  applied.taste = [];
  const matchSeg = sortSeg.querySelector('.seg[data-sort="match"]');
  const popSeg = sortSeg.querySelector('.seg[data-sort="pop"]');
  if (matchSeg) matchSeg.classList.remove("is-active");
  if (popSeg) popSeg.classList.add("is-active");
  sortKey = "pop";
  requestAnimationFrame(repositionThumb);
}

/* 필터 드롭다운 (다중선택) */
chipsWrap.addEventListener("click", (e) => {
  const chipBtn = e.target.closest(".filter > .chip-btn");
  const opt = e.target.closest(".filter-opt");
  if (chipBtn) {
    e.stopPropagation();
    const filter = chipBtn.parentElement;
    const key = filter.dataset.key;
    if (e.target.closest(".caret") && applied[key].length) { applied[key] = []; updateChip(key); closePops(); applyView(); return; }
    const pop = filter.querySelector(".filter-pop");
    const willOpen = !pop.classList.contains("is-open");
    closePops();
    if (willOpen) { pop.classList.add("is-open"); chipBtn.setAttribute("aria-expanded", "true"); }
    return;
  }
  if (opt) {
    e.stopPropagation();
    const filter = opt.closest(".filter");
    const key = filter.dataset.key;
    const val = opt.dataset.value;
    const arr = applied[key];
    const i = arr.indexOf(val);
    if (i >= 0) arr.splice(i, 1); else arr.push(val);
    updateChip(key);
    applyView();
    return;
  }
});
document.addEventListener("click", (e) => { if (!e.target.closest(".filter")) closePops(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePops(); });

/* 프로필 팝오버 */
const pill = document.getElementById("profilePill");
const pop = document.getElementById("profilePop");
pill.addEventListener("click", (e) => {
  e.stopPropagation();
  const open = pop.classList.toggle("is-open");
  pill.setAttribute("aria-expanded", open ? "true" : "false");
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".profile")) { pop.classList.remove("is-open"); pill.setAttribute("aria-expanded", "false"); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { pop.classList.remove("is-open"); pill.setAttribute("aria-expanded", "false"); } });
</script>
<script>
document.addEventListener('click',function(e){
  var lo=e.target.closest('[data-logout]'), li=e.target.closest('[data-login]');
  if(lo){e.preventDefault();try{localStorage.setItem('scentrip_auth','out');}catch(x){}location.href='home.html';}
  if(li){e.preventDefault();try{localStorage.setItem('scentrip_auth','in');}catch(x){}location.reload();}
});
</script>
<script>
/* 하트 = 저장 토글 (탐색·홈)
   카드가 다 그려진 뒤 하트를 버튼으로 감싸고, 저장 상태를 localStorage 에서 복원한다.
   내 여행과 반대로 여기서는 기본이 '저장 전'(빈 하트)이다. */
(function () {
  const KEY = "scentrip_saved_cards";
  let saved;
  try { saved = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) { saved = new Set(); }
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify([...saved])); } catch (e) {} };

  document.querySelectorAll(".heart").forEach((svg) => {
    if (svg.closest(".heart-btn")) return;                     // 이미 버튼인 화면은 건드리지 않는다
    const card = svg.closest(".card, .route-card, .featured-card");
    if (!card) return;
    const list = card.parentElement;
    const id = (list.id || list.className.split(" ")[0] || "row") + ":" + [...list.children].indexOf(card);
    card.dataset.save = id;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "heart-btn";
    svg.replaceWith(btn);
    btn.appendChild(svg);
    const on = saved.has(id);
    card.classList.toggle("is-saved", on);
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.setAttribute("aria-label", on ? "저장 해제" : "저장");
  });

  document.addEventListener("click", (e) => {
    const btn = e.target.closest(".heart-btn"); if (!btn) return;
    const card = btn.closest("[data-save]"); if (!card) return;
    e.preventDefault(); e.stopPropagation();                   // 카드 링크로 이동하지 않게
    const on = !card.classList.contains("is-saved");
    card.classList.toggle("is-saved", on);
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.setAttribute("aria-label", on ? "저장 해제" : "저장");
    on ? saved.add(card.dataset.save) : saved.delete(card.dataset.save);
    persist();
  });
})();
</script>
<script>
/* 저장된 프로필 사진을 모든 아바타에 반영 (마이페이지에서 변경) */
(function () {
  try {
    const src = localStorage.getItem("scentrip_avatar");
    if (!src) return;
    document.querySelectorAll(".av").forEach((el) => {
      el.classList.add("has-photo");
      el.style.backgroundImage = 'url("' + src + '")';
    });
  } catch (e) {}
})();
</script>
